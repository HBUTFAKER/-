<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><title>地面区域预览</title></head>
<body style="margin:0;background:#161a20">
<canvas id="c" width="1080" height="460"></canvas>
<script src="../src/data.js"></script>
<script src="../src/logic.js"></script>
<script src="../src/ui.js"></script>
<script>
  // 流沙池 / 定海神针法阵：单独拎出来看边缘、浓淡、和地面的贴合
  // 用法：?t=0.4（区域存在了多久，秒）
  const q = new URLSearchParams(location.search);
  const T = parseFloat(q.get('t') || '0.6');
  const c = document.getElementById('c'), ctx = c.getContext('2d');
  const W = c.width, H = c.height;

  // 一块"地面"，好判断沙坑有没有贴住地面
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#22303f'); g.addColorStop(0.62, '#2a3a34'); g.addColorStop(0.63, '#1d2a24'); g.addColorStop(1, '#121a17');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const now = 10000;
  const born = now - T * 1000;
  const game = {
    now,
    zones: [
      { kind: 'sand', x: 180, y: 330, r: 96, until: now + 6000, bornAt: born },
      { kind: 'sand', x: 430, y: 330, r: 130, until: now + 6000, bornAt: born },
      { kind: 'needle', x: 700, y: 330, r: 96, until: now + 6000, bornAt: born },
      { kind: 'sand', x: 900, y: 330, r: 70, until: now + 300, bornAt: born },
    ],
  };
  XY.UI.drawZones(ctx, game);
  // 神针的棒子本体是 drawSpinStaff 画的，这里补一根示意
  ctx.save();
  ctx.fillStyle = '#b8331f'; ctx.fillRect(695, 330 - 78, 10, 78);
  ctx.fillStyle = '#f4c430'; ctx.fillRect(691, 330 - 85, 18, 9); ctx.fillRect(691, 330 - 12, 18, 9);
  ctx.restore();

  ctx.fillStyle = '#9fb0c4'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
  const tags = ['流沙 r=96', '流沙 r=130', '定海神针（含棒子）', '流沙 即将消失'];
  [180, 430, 700, 900].forEach((x, i) => ctx.fillText(tags[i], x, 372));
  ctx.textAlign = 'left';
  ctx.fillStyle = '#e8eef6'; ctx.font = '15px sans-serif';
  ctx.fillText('地面区域 · 存在 ' + T.toFixed(2) + 's', 10, 24);
</script>
</body>
</html>
