<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>西游·降妖录 — 横版动作闯关</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: #0b0e14;
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        color: #e6e6e6; overflow: hidden;
      }
      #app {
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; height: 100%; gap: 12px;
      }
      #game {
        display: block; background: #11151f; border: 1px solid #2a3142;
        border-radius: 8px; box-shadow: 0 12px 40px rgba(0,0,0,.5);
        image-rendering: pixelated; max-width: 100%; max-height: 82vh;
        outline: none;
      }
      .hint { font-size: 13px; color: #8a93a6; letter-spacing: .5px; }
      .hint b { color: #ffd479; }
      #pad {
        display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
        justify-content: center; max-width: 900px;
      }
      #pad[hidden] { display: none; }
      #pad button {
        min-width: 46px; height: 42px; padding: 0 10px; cursor: pointer;
        background: #1b2233; color: #e6e6e6; border: 1px solid #3a4a66;
        border-radius: 8px; font-size: 14px; font-family: inherit;
        user-select: none; touch-action: none;
      }
      #pad button.on { background: #2a3550; border-color: #ffd479; color: #ffd479; }
      #pad .sep { width: 10px; }
      #pad .tip { font-size: 12px; color: #8a93a6; margin-left: 6px; }
      #diag {
        display: none; position: fixed; left: 0; right: 0; bottom: 0; max-height: 42vh;
        overflow: auto; margin: 0; padding: 12px 16px; white-space: pre-wrap;
        background: rgba(120,10,10,.94); color: #ffe3e3; font-size: 12px;
        font-family: Consolas, monospace; z-index: 99;
      }
    </style>
    <!-- 启动诊断：脚本一出错就直接显示在页面底部，不再白屏 -->
    <script>
      window.__bootErrors = [];
      window.__diag = function (msg) {
        try {
          var el = document.getElementById('diag');
          window.__bootErrors.push(msg);
          if (el) { el.style.display = 'block'; el.textContent += msg + '\n'; }
          if (window.console) console.error(msg);
        } catch (e) { /* 忽略 */ }
      };
      window.addEventListener('error', function (e) {
        var where = (e.filename || '') + (e.lineno ? ':' + e.lineno : '');
        window.__diag('[脚本错误] ' + (e.message || e.error || '未知') + (where ? '\n  ' + where : ''));
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        window.__diag('[Promise 错误] ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
      });
    </script>
  </head>
  <body>
    <div id="app">
      <canvas id="game" width="960" height="540" tabindex="0"></canvas>
      <div class="hint">
        <b>A D</b> 移动（双击奔跑） · <b>W</b> 跳（空中可二段跳） · <b>S</b> 快落 · <b>J</b> 普攻 · <b>K U I</b> 技能 · <b>1 2 3</b> 法宝 · <b>B</b> 背包 · <b>L</b> 锻造 · <b>G</b> 商店 · <b>H</b> 技能 · <b>P</b> 暂停 · <b>M</b> 静音
      </div>
      <!-- 键盘没接管时（预览面板/触屏）自动出现，用鼠标也能玩 -->
      <div id="pad" hidden>
        <button data-code="KeyA">A</button>
        <button data-code="KeyD">D</button>
        <button data-code="KeyW">W 跳</button>
        <button data-code="KeyS">S</button>
        <button data-code="KeyJ">普攻</button>
        <button data-code="KeyK">技1</button>
        <button data-code="KeyU">技2</button>
        <button data-code="KeyI">技3</button>
        <span class="sep"></span>
        <button data-code="Digit1">宝1</button>
        <button data-code="Digit2">宝2</button>
        <button data-code="Digit3">宝3</button>
        <span class="sep"></span>
        <button data-code="KeyB">背包</button>
        <button data-code="KeyL">锻造</button>
        <button data-code="KeyG">商店</button>
        <button data-code="KeyH">技能</button>
        <button data-code="KeyQ">上一页</button>
        <button data-code="KeyE">下一页</button>
        <button data-code="Enter">确认</button>
        <button data-code="KeyP">暂停</button>
        <button data-code="KeyM">静音</button>
        <span class="tip">键盘未接管时用这些按钮</span>
      </div>
    </div>
    <pre id="diag"></pre>

/* ===== logic.js ===== */
// 纯逻辑层：随机数 / 战斗 / 掉落 / 合成。无 DOM 依赖，可被 Node 测试直接 require。
(function (root) {
  const XY = (root.XY = root.XY || {});

  // —— 可复现 RNG（mulberry32）——
  XY.mulberry32 = function (seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  XY.randInt = function (rng, min, max) { return Math.floor(rng() * (max - min + 1)) + min; };
  XY.chance = function (rng, p) { return rng() < p; };

  // —— 战斗 ——
  // 伤害 = 攻击*倍率 - 防御*0.5（下限1）；暴击（按暴击率）翻倍
  // 任何参数缺失/非法都兜底成有限值：宁可少打，也不能让 NaN 污染血量（NaN 会让怪物永远打不死）
  XY.computeDamage = function (attacker, defender, multiplier, rng) {
    rng = rng || Math.random;
    const atk = Number(attacker && attacker.attack);
    const def = Number(defender && defender.defense);
    const mul = Number(multiplier);
    const A = Number.isFinite(atk) ? atk : 0;
    const D = Number.isFinite(def) ? def : 0;
    const M = Number.isFinite(mul) && mul > 0 ? mul : 1;
    const base = A * M - D * 0.5;
    const raw = Math.max(1, Math.round(base));
    const crit = XY.chance(rng, attacker && attacker.critRate ? attacker.critRate : 0);
    return { amount: crit ? raw * 2 : raw, crit: crit };
  };
  XY.applyDamage = function (curHp, amount) { return Math.max(0, curHp - amount); };
  XY.expToNext = function (level) { return 50 + (level - 1) * 30; };
  XY.killExp = function (enemyLevel) { return 20 + enemyLevel * 10; };

  XY.scaleEnemyStats = function (base, level) {
    const f = 1 + (level - 1) * 0.18;
    return {
      name: base.name, aggroRange: base.aggroRange, dropTable: base.dropTable,
      maxHp: Math.round(base.hp * f), hp: Math.round(base.hp * f),
      attack: Math.round(base.attack * f), defense: Math.round(base.defense * f),
      moveSpeed: base.moveSpeed,
    };
  };

  XY.rollDrops = function (table, rng) {
    rng = rng || Math.random;
    const result = {};
    for (const e of table) {
      if (!XY.chance(rng, e.chance)) continue;
      const qty = XY.randInt(rng, e.min, e.max);
      if (qty <= 0) continue;

    const cast = pose.castP;
    // 受击：0..1 的进度。抬一个底数让"挨打那一帧"就立刻后仰，再慢慢回正
    const hurt = pose.hurtP;
    const hurtK = hurt === undefined ? 0 : Math.sin(Math.min(1, 0.22 + hurt * 0.78) * Math.PI);
    // 风的强度：跑动/冲刺/出招时盔缨与雉翎向后掠
    const windAmt = Math.min(1, (state === 'dash' ? 1 : 0) + (run ? (sprint ? 0.9 : 0.55) : 0)
      + (atk !== undefined ? 0.5 : 0) + (cast !== undefined ? 0.3 : 0));

    const ph = sprint ? t / 58 : t / 85; // 奔跑时步频更密
    const bob = air ? 0 : (run ? Math.abs(Math.sin(ph)) * (sprint ? 2.6 : 1.8) : Math.sin(t / 430) * 1.1);
    let legA = run ? Math.sin(ph) * (sprint ? 0.86 : 0.62) : (air ? 0.35 : 0.06);
    let legB = run ? -Math.sin(ph) * (sprint ? 0.86 : 0.62) : (air ? -0.3 : -0.06);
    const armBase = run ? Math.sin(ph) * (sprint ? 0.58 : 0.4) : 0.08;
    // 挨打时两腿撑开、脚下一沉，站桩不再板正
    if (hurtK) { legA += 0.2 * hurtK; legB -= 0.26 * hurtK; }

    ctx.save();
    ctx.translate(cx, footY);

    // 地面投影
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    if (ctx.ellipse) ctx.ellipse(0, 0, 15 * scale, 4 * scale, 0, 0, Math.PI * 2);
    else ctx.arc(0, 0, 10 * scale, 0, Math.PI * 2);
    ctx.fill();

    ctx.scale(facing * scale, scale);
    // 奔跑时整体前倾（旋转中心在脚底，脚不会离地）
    if (sprint) ctx.rotate(0.085);
    ctx.translate(0, -bob);

    // 出招时的重心变化（同样以脚底为轴）：每段招式一套自己的重心/弓步/低头
    let bodyTilt = 0, bodyShift = null, headDx = 0, headDy = 0;
    if (hurt !== undefined) {
      // 受击：被顶得向后仰，再慢慢把重心收回来
      bodyTilt = -0.34 * Math.sin(Math.min(1, hurt * 1.25) * Math.PI);
      ctx.translate(-7 * hurtK, 3 * hurtK);
    } else if (atk !== undefined) {
      const m = attackMotion(pose.attackBody || pose.attackKind || 0, atk);
      bodyTilt = m.tilt;
      legA += m.legA; legB += m.legB;      // 弓步/马步：腿也跟着招式走
      headDx = m.headX; headDy = m.headY;  // 头比躯干慢半拍
      bodyShift = m;
    } else if (state === 'dash') bodyTilt = 0.17;
    else if (pose.castId === 'wk_smash') bodyTilt = -0.08;
    if (bodyTilt) ctx.rotate(bodyTilt);
    if (bodyShift) ctx.translate(bodyShift.x, bodyShift.y);

    // —— 手臂 / 兵器姿态：先算好，才知道要不要画在躯干后面 ——
    // 手臂与兵器分开驱动：arm 控手臂，wpn 是兵器的绝对角 → 兵器始终握在手里。
    // weaponBehind：像"甩"的反手蓄力，棒子要甩到背脊后面去，画在躯干前会从脸上穿过去。
    const SHX = 6, SHY = -41, ARM = 14;   // 肩点、手臂长度（角色坐标）
    let armAng, wpnAng, offX = 0, offY = 0, wpnShift = 0, weaponBehind = false, armLen = ARM, backArmAng = null;
    if (hurt !== undefined) {
      // 挨打：手臂被甩到身后，兵器顺手往下滑，护不住架势
      armAng = 0.62 + 0.5 * hurtK; wpnAng = 0.2 + 1.05 * hurtK;
      offX = -2 * hurtK; offY = 2 * hurtK;
    } else if (atk !== undefined) {
      const sp = swingProfile(pose.attackPath || pose.attackKind || 0, atk);
      armAng = sp.arm; wpnAng = sp.wpn; offX = sp.x; offY = sp.y; wpnShift = sp.g || 0;
      armLen = sp.armLen || ARM;   // 手臂跟着招式伸缩，握点不会飞离手掌
      weaponBehind = !!sp.behind;
      if (sp.backArm !== undefined) backArmAng = sp.backArm;  // 空手招式要两条胳膊一起动
    } else if (pose.castId === 'wk_smash') {
      const q = cast === undefined ? 0 : cast;
      armAng = -2.0 + q * 0.2; wpnAng = -0.5 + q * 0.14;      // 举棒过顶，蓄力
    } else if (pose.castId === 'wk_spin') {
      armAng = -0.95 + (cast === undefined ? 0 : cast) * 0.9; // 抖腕掷出
      wpnAng = 0.55;
    } else if (state === 'dash') {
      armAng = 1.0; wpnAng = -0.46;                            // 棒背身后
    } else if (cast !== undefined) {
      armAng = -0.62; wpnAng = -0.5;                           // 其余施法：抬臂
    } else {
      // 站立：棒子斜靠在身侧。倾斜给足，不然一根竖着的棒正好压在脸上
      armAng = armBase * 0.5 - 0.34; wpnAng = 0.46 + armBase * 0.12;
    }
    // 握点：肩点 + 手臂旋转（+ 招式带来的前送/下沉）
    const handX = SHX - Math.sin(armAng) * armLen + offX;
    const handY = SHY + Math.cos(armAng) * armLen + offY;

    const drawArmAndWeapon = () => {
      ctx.save();
      ctx.translate(SHX, SHY);
      ctx.rotate(armAng);
      drawArm(ctx, 0, 0, 0, A, armLen);
      ctx.restore();
      if (!pose.noWeapon) {
        ctx.save();
        ctx.translate(handX + 1.2, handY);
        ctx.rotate(wpnAng);
        if (wpnShift) ctx.translate(0, wpnShift);
        drawWeapon(ctx, A);
        ctx.restore();
        // 手（画在兵器之后，形成"握住"的遮挡关系）
        circle(ctx, handX + 1.2, handY, 3.6); shape(ctx, A.skin, 1.1);
        circle(ctx, handX + 1.2, handY, 1.6); ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fill();
      }
    };
    if (weaponBehind) drawArmAndWeapon();

    // —— 奔跑速度线（身后拖几道细线，强化"更快"的感觉）——
    if (sprint) {
      ctx.strokeStyle = 'rgba(255,247,220,0.28)';
      ctx.lineWidth = 1.6;
      ctx.lineCap = 'round';
      for (let i = 0; i < 3; i++) {
        const yy = -46 + i * 15;
        const len = 20 + ((t / 3 + i * 17) % 16);
        ctx.beginPath();
        ctx.moveTo(-16 - len * 0.4, yy);
        ctx.lineTo(-16 - len, yy + 1.5);
        ctx.stroke();
      }
    }

    // —— 披风（身后，随风摆动） ——
    if (A.cape) {
      const flap = Math.sin(t / 120) * 4 + (run ? 7 : 0) + (air ? 10 : 0);
      ctx.beginPath();
      ctx.moveTo(-2, -48);
      ctx.quadraticCurveTo(-22 - flap * 0.6, -34, -26 - flap, -2);
      ctx.quadraticCurveTo(-14 - flap * 0.3, -12, -6, -20);
      ctx.closePath();
      ctx.fillStyle = A.cape; ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.32)'; ctx.lineWidth = 1.2; ctx.stroke();
      // 内层高光，避免死板色块
      ctx.beginPath();
      ctx.moveTo(-3, -45);
      ctx.quadraticCurveTo(-16 - flap * 0.4, -32, -19 - flap * 0.7, -8);
      ctx.quadraticCurveTo(-11, -16, -6, -22);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,255,255,0.16)'; ctx.fill();
    }

    // —— 后腿 ——
    drawLeg(ctx, -3.5, legB, A);
    // —— 后臂 ——
    drawArm(ctx, -4.5, -42, backArmAng !== null ? backArmAng : armBase + 0.3, A, 15);

    // —— 脖子 ——
    rr(ctx, -3.2, -52, 6.4, 8, 2.6); shape(ctx, A.skin, 1.1);

    // —— 身体 ——
    ctx.save();
    // 腰/裙甲
    ctx.fillStyle = A.armorDark;
    rr(ctx, -9.5, -27, 19, 12, 5); shape(ctx, A.armorDark, 1.3);
    // 胸甲
    rr(ctx, -10.5, -47, 21, 22, 7); shape(ctx, A.armor, 1.5);
    // 胸口纹样
    ctx.beginPath();
    ctx.moveTo(-5, -42); ctx.quadraticCurveTo(0, -36, 5, -42);
    ctx.strokeStyle = A.trim; ctx.lineWidth = 2; ctx.stroke();
    if (A.helmet) {
      // 护心镜：金甲正中的圆镜，一并压出"重甲"感
      circle(ctx, 0, -39, 5.4); shape(ctx, A.mirror, 1.4);
      circle(ctx, 0, -39, 2.6); ctx.fillStyle = 'rgba(184,134,11,0.5)'; ctx.fill();
      circle(ctx, -1.3, -40.4, 1.5); ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fill();
      // 披膊：肩下两层甲片
      for (const sx of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(sx * 4.6, -46);
        ctx.lineTo(sx * 10.6, -44);
        ctx.lineTo(sx * 9.6, -34);
        ctx.lineTo(sx * 5.2, -36);
        ctx.closePath();
        shape(ctx, A.armorDark, 1.1);
      }
    }
    if (A.belly) { // 八戒的肚子
      ctx.beginPath();
      if (ctx.ellipse) ctx.ellipse(6, -28, 7, 6, 0, 0, Math.PI * 2);
      else ctx.arc(6, -28, 6, 0, Math.PI * 2);
      shape(ctx, '#e6c6a4', 1.2);
    }
    // 腰带
    rr(ctx, -9.5, -27.5, 19, 4, 2); shape(ctx, A.trim, 1);
    // 缠颈红巾
    if (A.cape) {
      rr(ctx, -6.4, -50.5, 12.8, 5, 2.4); shape(ctx, A.cape, 1.2);
      ctx.beginPath();
      ctx.moveTo(4, -47); ctx.lineTo(9, -44); ctx.lineTo(6, -40);
      ctx.closePath(); shape(ctx, A.cape, 1);
    }
    ctx.restore();

    // —— 前腿 ——
    drawLeg(ctx, 4, legA, A);

    // —— 战裙（三片甲，压在腿上）——
    if (A.helmet) {
      for (let i = -1; i <= 1; i++) {
        const bx = i * 5.9;
        ctx.beginPath();
        ctx.moveTo(bx - 3, -24.6);
        ctx.lineTo(bx + 3, -24.6);
        ctx.lineTo(bx + 3.8, -15.2);
        ctx.lineTo(bx - 3.8, -15.2);
        ctx.closePath();
        shape(ctx, i === 0 ? A.armor : A.armorDark, 1.1);
        // 甲片下缘金边
        line(ctx, bx - 3.4, -16.2, bx + 3.4, -16.2, 1.2, A.trim);
      }
    }

    // —— 头 ——
    const mood = state === 'attack' ? 'angry' : (state === 'hurt' ? 'hurt' : 'calm');
    // 受击时头比身体更"慢半步"：先往后一挫，再跟着躯干回正
    Art.drawFace(ctx, 1 + headDx - 2.8 * hurtK, -56 + headDy + 1.4 * hurtK, 10, charId, { t: t, mood: mood, wind: windAmt, hurt: hurtK });
    if (!weaponBehind) drawArmAndWeapon();



    // —— 护肩（贴在前臂根部，做出重甲感）——
    ctx.beginPath();
    if (ctx.ellipse) ctx.ellipse(7.2, -45.2, 5.6, 4.2, -0.3, 0, Math.PI * 2);
    else ctx.arc(7.2, -45.2, 4.8, 0, Math.PI * 2);
    shape(ctx, A.armorDark, 1.3);
    ctx.beginPath();
    if (ctx.ellipse) ctx.ellipse(7.4, -46.2, 3.4, 1.8, -0.3, 0, Math.PI * 2);
    else ctx.arc(7.4, -46.2, 2.4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.fill();

    ctx.restore();
  };

  function drawLeg(ctx, hx, ang, A) {
    ctx.save();
    ctx.translate(hx, -23);
    ctx.rotate(ang);
    rr(ctx, -4.2, 0, 8.4, 19, 4); shape(ctx, A.armorDark, 1.3);
    // 靴
    rr(ctx, -4.8, 15, 10, 6.5, 2.5); shape(ctx, '#3a2a1c', 1.2);
    ctx.restore();
  }
  function drawArm(ctx, sx, sy, ang, A, len) {
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(ang);
    rr(ctx, -3.2, 0, 6.4, len, 3.2); shape(ctx, A.armor, 1.2);
    if (A.helmet) { // 护腕（金箍环）
      rr(ctx, -3.7, len * 0.4, 7.4, 5.4, 2.2); shape(ctx, A.armorDark, 1);
      line(ctx, -3.1, len * 0.43, 3.1, len * 0.43, 1, A.trim);
    }
    circle(ctx, 0, len, 3.2); shape(ctx, A.skin, 1.1);
    ctx.restore();
  }

  // ============================================================
  // 普攻动作：path（兵器轨迹）× body（身体语言）两套曲线
  // 每个角色的四式在 data.js 的 XY.BASIC_COMBO 里指定用哪条曲线，
  // 所以五个人打起来是五种身法，不是同一套动作换皮。
  // ============================================================
  function seg(p, a, b) { return Math.min(1, Math.max(0, (p - a) / (b - a))); }
  function easeOut(p) { return 1 - (1 - p) * (1 - p); }
  function easeIn(p) { return p * p; }
  function easeInOut(p) { return p < 0.5 ? 2 * p * p : 1 - 2 * (1 - p) * (1 - p); }

  // —— 身体语言 ——
  // 返回：tilt 躯干倾角 / x,y 整体位移（y 正=下沉）/ headX,headY 头部滞后 / legA,legB 前后腿
  // 约定：tilt 正=往前压，负=后仰；legA/legB 负=腿往前迈
  const BODIES = {
    // 劈：举棒过顶（后仰、踮起）→ 劈下来（前压、屈膝、扎马步）→ 压住重心
    chop(p) {
      const rai = easeOut(seg(p, 0, 0.26));
      const down = easeOut(seg(p, 0.34, 0.58));
      const ret = seg(p, 0.8, 1);
      return {
        tilt: -0.22 * rai + 0.55 * down - 0.32 * ret,
        x: -4 * rai + 12 * down - 8 * ret,
        y: -3 * rai + 7 * down - 4 * ret,
        headX: 2 * down - 2 * ret, headY: -2 * rai + 5 * down - 3 * ret,
        legA: 0.15 - 0.85 * down + 0.6 * ret,
        legB: -0.06 + 0.5 * rai + 0.2 * down,
      };
    },
    // 戳：沉腰后坐 → 弓步捅出去，身体几乎不上下
    thrust(p) {
      const back = easeOut(seg(p, 0, 0.22));
      const out = easeOut(seg(p, 0.3, 0.5));
      const ret = seg(p, 0.7, 1);
      return {
        tilt: -0.2 * back + 0.44 * out - 0.2 * ret,
        x: -9 * back + 17 * out - 10 * ret,
        y: 3.4 - 2 * out + 1.4 * ret,
        headX: 2.6 * out - 1.6 * ret, headY: 2 * back + 2.2 * out - 3 * ret,
        legA: 0.18 - 0.92 * out + 0.68 * ret,
        legB: -0.05 + 0.7 * back + 0.26 * out - 0.42 * ret,
      };
    },
    // 挑：先蹲到底 → 拔身撩起，整个人往上"长"
    lift(p) {
      const low = easeOut(seg(p, 0, 0.26));
      const up = easeOut(seg(p, 0.34, 0.62));
      const ret = seg(p, 0.8, 1);
      return {
        tilt: 0.24 * low - 0.42 * up + 0.2 * ret,
        x: -3 * low + 6 * up - 3 * ret,
        y: 8 * low - 8 * up + 3 * ret,
        headX: -1.4 * low + 1.4 * up, headY: 4 * low - 7 * up + 3.5 * ret,
        legA: -0.1 + 0.5 * low - 0.3 * up,
        legB: 0.16 + 0.7 * low - 0.35 * up,
      };
    },
    // 甩：拧腰蓄力 → 一圈横扫 → 收势偏后、腿扎马步
    sweep(p) {
      const wind = easeOut(seg(p, 0, 0.24));
      const sw = easeOut(seg(p, 0.32, 0.6));
      const ret = seg(p, 0.76, 1);
      return {
        tilt: -0.26 * wind + 0.46 * sw - 0.24 * ret,
        x: -9 * wind + 17 * sw - 10 * ret,
        y: 3 + 2 * wind - 3 * sw + 1.5 * ret,
        headX: -3 * wind + 4.5 * sw - 1.5 * ret, headY: 1.6 * wind + 1.6 * sw,
        legA: -0.3 - 0.35 * wind + 0.3 * sw,
        legB: 0.35 + 0.28 * wind - 0.2 * sw,
      };
    },
    // 砸（八戒筑 / 沙僧铲）：双手举过头顶 → 整个人压下去，蹲得最深
    smash(p) {
      const up = easeOut(seg(p, 0, 0.26));
      const down = easeIn(seg(p, 0.32, 0.56));
      const ret = seg(p, 0.8, 1);
      return {
        tilt: -0.3 * up + 0.66 * down - 0.34 * ret,
        x: -3 * up + 9 * down - 6 * ret,
        y: -7 * up + 11 * down - 4 * ret,
        headX: 1.5 * down - 1 * ret, headY: -4 * up + 7 * down - 3 * ret,
        legA: 0.3 - 0.95 * down + 0.65 * ret,
        legB: -0.2 + 0.6 * up + 0.3 * down,
      };
    },
    // 搂（八戒）：耙子探出去 → 整个人往后坐、往回拽
    reel(p) {
      const out = easeOut(seg(p, 0, 0.2));
      const pull = easeOut(seg(p, 0.22, 0.52));
      const ret = seg(p, 0.8, 1);
      return {
        tilt: 0.16 * out - 0.44 * pull + 0.28 * ret,
        x: 5 * out - 9 * pull + 4 * ret,
        y: 2 * out + 3 * pull - 2 * ret,
        headX: 2 * out - 3 * pull + 1 * ret, headY: 1 * out + 2 * pull,
        legA: 0.2 * out + 0.45 * pull - 0.45 * ret,
        legB: -0.1 * out - 0.5 * pull + 0.35 * ret,
      };
    },
    // 撞（八戒）：先正面压低蓄力 → 整个人前倾冲出去
    charge(p) {
      const crouch = easeOut(seg(p, 0, 0.18));
      const go = easeOut(seg(p, 0.2, 0.46));
      const ret = seg(p, 0.7, 1);
      return {
        tilt: 0.1 * crouch + 0.42 * go - 0.3 * ret,
        x: -3 * crouch + 11 * go - 8 * ret,
        y: 5 * crouch - 4 * go + 1 * ret,
        headX: 3 * go - 1 * ret, headY: 3 * crouch - 2 * go,
        legA: 0.35 * crouch + 0.75 * go - 0.7 * ret,
        legB: -0.25 * crouch - 0.65 * go + 0.55 * ret,
      };
    },
    // 踢（唐僧）：抬膝 → 侧踢出去 → 收腿，上身反着后仰
    kick(p) {
      const chamber = easeOut(seg(p, 0, 0.22));
      const out = easeOut(seg(p, 0.26, 0.5));
      const ret = seg(p, 0.72, 1);
      return {
        tilt: 0.18 * chamber - 0.42 * out + 0.22 * ret,
        x: -1 * chamber + 4 * out - 3 * ret,
        y: -1 * chamber - 2 * out + 1 * ret,
        headX: 1.6 * out - 1 * ret, headY: -1 * chamber,
        legA: 0.25 * chamber - 1.5 * out + 1.3 * ret,
        legB: 0.1 * chamber - 0.12 * out,
      };
    },
    // 站定（唐僧金刚掌）：身体几乎不动，只有一点前送——靠手臂和光效撑住
    calm(p) {
      const push = easeOut(seg(p, 0.2, 0.55));
      const ret = seg(p, 0.8, 1);
      return {
        tilt: 0.1 * push - 0.05 * ret,
        x: 1 * push - 1 * ret,
        y: 4 * push - 1 * ret,
        headX: 1 * push, headY: 2.4 * push,
        legA: 0.28 * push - 0.1 * ret, legB: -0.32 * push + 0.1 * ret,
      };
    },
  };
  const BODY_BY_KIND = ['chop', 'thrust', 'lift', 'sweep'];
  function attackMotion(body, p) {
    if (typeof body === 'number') body = BODY_BY_KIND[body] || 'chop';
    return (BODIES[body] || BODIES.chop)(p);
  }
  Art.attackMotion = attackMotion;

  // —— 兵器轨迹 ——
  // 返回：手臂角 arm（0 垂下，正=往后摆）、兵器绝对角 wpn（0 竖直向上，正=棒头往前倒）、
  //       握点偏移 x/y、握把偏移 g（正=握点靠近棒头）、手臂伸展 armLen、behind 画在躯干后
  const PATHS = {
    // 劈：棒子先抡到肩后 → 一整条圆弧劈到前下方
    arc(p) {
      const raiArm = easeOut(seg(p, 0, 0.14));
      const rai = easeOut(seg(p, 0.06, 0.26));
      const down = easeIn(seg(p, 0.28, 0.52));
      const over = easeOut(seg(p, 0.58, 0.7));
      const ret = seg(p, 0.8, 1);
      return {
        arm: -0.34 + raiArm * 0.84 - down * 1.59 + over * 0.02 + ret * 0.75,
        wpn: -0.2 - rai * 0.8 + down * 3.12 - ret * 2.8,
        armLen: 14 - raiArm * 1 + down * 2 - ret * 1,
        x: -rai * 2 + down * 6 + over * 2 - ret * 6,
        y: -rai * 2.5 + down * 4 - ret * 1.5,
        g: -down * 7 - over * 2 + ret * 9,
      };
    },
    // 戳：身前斜举 → 手往前一送、棒子平捅出去
    thrust(p) {
      const out = easeOut(seg(p, 0.14, 0.42));
      const hold = seg(p, 0.42, 0.58);
      const ret = seg(p, 0.72, 1);
      return {

  // 掷出去的金箍棒：空中急旋 / 插进大地（供 UI 层绘制）
  Art.drawSpinStaff = function (ctx, s, now) {
    const fade = (typeof s.fade === 'number' && isFinite(s.fade)) ? Math.max(0, Math.min(1, s.fade)) : 1;
    if (fade <= 0.01) return;
    ctx.save();
    ctx.translate(s.x, s.y);
    if (s.state === 'stuck') {
      const age = Math.max(0, (now - (s.landAt || now)) / 1000);
      const a = fade * (age > 0.8 ? Math.max(0, 1 - (age - 0.8) / 0.3) : 1);
      if (a <= 0.01) { ctx.restore(); return; }
      // 砸出来的坑 + 几块碎石（不做放射状裂纹，免得读成"钟面"）
      ctx.fillStyle = 'rgba(0,0,0,0.38)';
      ctx.beginPath();
      if (ctx.ellipse) ctx.ellipse(0, 1, 36, 9, 0, 0, Math.PI * 2);
      else ctx.arc(0, 1, 28, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(150,112,72,0.95)';
      for (let i = 0; i < 4; i++) {
        const rx = (i % 2 ? 1 : -1) * (22 + i * 7);
        ctx.fillRect(rx, -4 - (i % 3) * 3, 6, 4);
      }
      ctx.rotate(-0.06 + Math.sin(age * 26) * 0.035 * Math.max(0, 1 - age * 1.6));
      ctx.globalAlpha = a;
      ctx.scale(1.9, 1.9);
      drawWeapon(ctx, ART.wukong);
      ctx.restore();
      return;
    }
    // 飞行：棒身自旋 + 两道旋转金弧
    ctx.globalAlpha = fade;
    ctx.save();
    ctx.rotate(-s.spin * 0.45);
    ctx.strokeStyle = 'rgba(255,246,214,0.3)';
    ctx.lineWidth = 9;
    ctx.beginPath(); ctx.arc(0, 0, 42, 0.5, 2.2); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,214,120,0.55)';
    ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(0, 0, 42, 0.35, 2.5); ctx.stroke();
    ctx.restore();
    ctx.rotate(s.spin);
    ctx.scale(1.75, 1.75);
    drawWeapon(ctx, ART.wukong);
    ctx.restore();
  };

  // ===== 怪物 =====
  // scale：按碰撞盒高度自动缩放（Boss 的碰撞盒比小怪大得多）
  Art.drawEnemy = function (ctx, e, t, scale) {
    const flash = e.hitFlash > 0;
    const k = scale || 1;
    // 出手前冲：让"打人"有动作，而不是站着贴图
    const atkLeft = (e.atkUntil || 0) - t;
    const lunge = atkLeft > 0 ? Math.sin(Math.min(1, atkLeft / 260) * Math.PI) * 7 : 0;
    ctx.save();
    ctx.translate(e.x + e.w / 2, e.y + e.h);
    const sx = (e.facing || -1) < 0 ? -1 : 1;
    ctx.scale(sx * k, k);
    ctx.translate(lunge, 0);
    // 被打：身体向后一顿 + 后仰，让每次命中都有反馈
    const hurtLeft = (e.hurtUntil || 0) - t;
    const hurtK = hurtLeft > 0 ? Math.sin(Math.min(1, hurtLeft / 200) * Math.PI) : 0;
    if (hurtK) { ctx.translate(-4.5 * hurtK, 0); ctx.rotate(-0.11 * hurtK); }
    const body = flash ? '#ffffff' : null;

    if (e.kind === 'wolf') {
      // 妖狼：靠剪影认人——弓背、长吻、大尖耳、粗尾、四条粗腿
      const fur = body || '#7a5432', dark = body || '#462d17';
      const g = Math.sin(t / 95) * 2.6;
      // 尾巴：向后扬起
      ctx.beginPath();
      ctx.moveTo(-18, -23);
      ctx.quadraticCurveTo(-31, -27, -28, -36);
      ctx.strokeStyle = dark; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.stroke();
      // 远侧两腿（暗一档，垫在后面）
      line(ctx, -11, -14, -8 + g, -1, 3.2, dark);
      line(ctx, 9, -14, 12 - g, -1, 3.2, dark);
      // 近侧两腿：后腿带弯，前腿直撑
      line(ctx, -14, -15, -15 - g, -7, 4.2, fur);
      line(ctx, -15 - g, -7, -12 - g * 0.5, -1, 3.8, fur);
      line(ctx, 8, -15, 10 + g, -1, 4.2, fur);
      // 身体：背线拱起，前胸高后腰低
      ctx.beginPath();
      ctx.moveTo(-20, -14);
      ctx.quadraticCurveTo(-23, -29, -8, -30);
      ctx.quadraticCurveTo(6, -31, 12, -24);
      ctx.quadraticCurveTo(15, -16, 6, -13);
      ctx.quadraticCurveTo(-8, -11, -20, -14);
      ctx.closePath();
      shape(ctx, fur, 1.5);
      // 头：大，长吻前探
      ctx.beginPath();
      ctx.moveTo(5, -27);
      ctx.quadraticCurveTo(16, -34, 25, -28);
      ctx.quadraticCurveTo(29, -23.5, 24.5, -19.5);
      ctx.lineTo(8, -19);
      ctx.closePath();
      shape(ctx, fur, 1.5);
      // 大尖耳（最醒目的狼特征）
      ctx.beginPath(); ctx.moveTo(8.5, -28); ctx.lineTo(6, -38); ctx.lineTo(15.5, -30.5); ctx.closePath(); shape(ctx, dark, 1);
      ctx.beginPath(); ctx.moveTo(17, -31); ctx.lineTo(20, -39); ctx.lineTo(23.5, -30); ctx.closePath(); shape(ctx, dark, 1);
      // 獠牙
      ctx.beginPath(); ctx.moveTo(22.5, -22); ctx.lineTo(23.5, -17.5); ctx.lineTo(20.5, -21); ctx.closePath(); shape(ctx, '#f2e8d5', 0.6);

    } else if (e.kind === 'spider') {

        ctx.quadraticCurveTo((rx0 + fx) * 0.5, -15 + ph, fx, -0.8 + ph * 0.4);
        ctx.strokeStyle = leg; ctx.lineWidth = 2.2;
        ctx.lineCap = 'round'; ctx.stroke();
      }
      // 头胸部
      circle(ctx, 10, -16.5, 6.2); shape(ctx, skin, 1.4);
      // 螯肢
      ctx.beginPath(); ctx.moveTo(13.5, -13); ctx.lineTo(18, -8.5); ctx.lineTo(12, -11); ctx.closePath(); shape(ctx, dark, 0.8);
      // 眼：两颗大的在前
      circle(ctx, 12.4, -19.6, 1.9); ctx.fillStyle = '#ff6b6b'; ctx.fill();
      circle(ctx, 15, -16.8, 1.5); ctx.fillStyle = '#ff6b6b'; ctx.fill();
      circle(ctx, 8.6, -20.4, 1.1); ctx.fillStyle = '#ff9b9b'; ctx.fill();
    } else if (e.kind === 'boss') {
      // 牛魔王
      ctx.fillStyle = body || '#8e2b2b';
      rr(ctx, -22, -76, 44, 62, 12); shape(ctx, body || '#8e2b2b', 1.8);
      // 牛角
      ctx.strokeStyle = body || '#e8dcc8'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(s * 14, -74);
        ctx.quadraticCurveTo(s * 34, -86, s * 30, -66);
        ctx.stroke();
      }
      // 眼睛
      for (const s of [-1, 1]) { circle(ctx, s * 9, -58, 3.4); ctx.fillStyle = '#ffd479'; ctx.fill(); }
      // 鼻环
      ctx.strokeStyle = '#ffd479'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, -44, 6, 0, Math.PI); ctx.stroke();
      // 斧
      ctx.save(); ctx.translate(26, -50); ctx.rotate(Math.sin(t / 400) * 0.1);
      rr(ctx, -2, -26, 4, 50, 2); shape(ctx, '#5b4a32', 1.2);
      ctx.beginPath();
      ctx.moveTo(0, -30); ctx.quadraticCurveTo(18, -24, 14, -6); ctx.lineTo(0, -10);
      ctx.closePath(); shape(ctx, '#c9cfd6', 1.4);
      ctx.restore();
    } else { // imp 小妖：短腿 + 圆身 + 角 + 獠牙，比纯色块好辨认
      const dark = body || '#8e2f26';
      // 腿
      line(ctx, -6, -8, -8, 0, 3.2, dark);
      line(ctx, 6, -8, 8, 0, 3.2, dark);
      // 手臂
      line(ctx, -11, -18, -17, -10, 3, dark);
      line(ctx, 11, -18, 17, -10, 3, dark);
      // 身子
      ctx.beginPath();
      if (ctx.ellipse) ctx.ellipse(0, -18, 13, 14, 0, 0, Math.PI * 2);
      else ctx.arc(0, -18, 13, 0, Math.PI * 2);
      shape(ctx, body || '#b5483b', 1.5);
      // 肚皮
      ctx.beginPath();
      if (ctx.ellipse) ctx.ellipse(1, -15, 7, 8, 0, 0, Math.PI * 2);
      else ctx.arc(1, -15, 7, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,220,190,0.35)'; ctx.fill();
      // 角
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(s * 6, -29); ctx.quadraticCurveTo(s * 11, -37, s * 4, -39);
        ctx.lineTo(s * 2.5, -30); ctx.closePath();
        shape(ctx, body || '#f0e0c0', 1.2);
      }
      // 眼
      for (const s of [-1, 1]) { circle(ctx, s * 4.5, -21, 2.4); ctx.fillStyle = '#2b1210'; ctx.fill(); }
      // 獠牙
      ctx.fillStyle = '#fff8e6';
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.moveTo(s * 3, -14); ctx.lineTo(s * 5, -11); ctx.lineTo(s * 1.5, -12); ctx.closePath(); ctx.fill();
      }
    }
    ctx.restore();
  };

  // ===== 技能图标 =====
  // kind: melee/dash/aoe/ranged/heal/buff，按类型给不同图形
  Art.drawSkillIcon = function (ctx, x, y, size, skill, cdPct, ready) {
    const col = skillColor(skill);
    ctx.save();
    // 底
    rr(ctx, x, y, size, size, size * 0.2);
    ctx.fillStyle = '#141a26'; ctx.fill();
    ctx.strokeStyle = ready ? col : '#3a4a66'; ctx.lineWidth = 2; ctx.stroke();
    // 图形
    const cx = x + size / 2, cy = y + size / 2, r = size * 0.3;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = Math.max(2, size * 0.07); ctx.lineCap = 'round';
    const sid = skill.id || '';
    if (sid === 'wk_smash') {
      // 暴涨的金箍棒 + 砸地冲击
      rr(ctx, -r * 0.34, -r * 1.15, r * 0.68, r * 1.6, r * 0.14); ctx.fillStyle = col; ctx.fill();
      rr(ctx, -r * 0.62, -r * 1.42, r * 1.24, r * 0.42, r * 0.12); ctx.fillStyle = '#ffe27a'; ctx.fill();
      rr(ctx, -r * 0.62, r * 0.42, r * 1.24, r * 0.42, r * 0.12); ctx.fillStyle = '#ffe27a'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,246,214,0.9)'; ctx.lineWidth = Math.max(1.6, size * 0.055);
      ctx.beginPath();
      if (ctx.arc) ctx.arc(0, r * 1.02, r * 0.78, Math.PI * 0.22, Math.PI * 0.78);
      ctx.stroke();
    } else if (sid === 'wk_dash') {
      // 祥云 + 速度线
      const u = size / 60;
      const puffs = [[-11, 3, 7], [0, -3, 9.5], [10, 3, 6.5]];
      ctx.fillStyle = 'rgba(255,247,226,0.95)';
      for (let i = 0; i < puffs.length; i++) {
        circle(ctx, puffs[i][0] * u, puffs[i][1] * u, puffs[i][2] * u); ctx.fill();
      }
      ctx.strokeStyle = 'rgba(255,206,128,0.9)'; ctx.lineWidth = Math.max(1.4, size * 0.05);
      ctx.beginPath();
      if (ctx.arc) ctx.arc(0, -3 * u, 9 * u, Math.PI * 1.06, Math.PI * 1.94);
      ctx.stroke();
      // 前冲箭头
      ctx.strokeStyle = col; ctx.lineWidth = Math.max(2, size * 0.075);
      ctx.beginPath();
      ctx.moveTo(-r * 1.15, r * 0.95); ctx.lineTo(r * 0.95, r * 0.95);
      ctx.moveTo(r * 0.45, r * 0.6); ctx.lineTo(r * 0.95, r * 0.95); ctx.lineTo(r * 0.45, r * 1.3);
      ctx.stroke();
    } else if (sid === 'wk_spin') {
      // 斜插的棒子 + 旋转轨迹
      ctx.save();
      ctx.rotate(-0.62);
      rr(ctx, -r * 0.2, -r * 1.12, r * 0.4, r * 1.9, r * 0.1); ctx.fillStyle = col; ctx.fill();
      rr(ctx, -r * 0.38, -r * 1.3, r * 0.76, r * 0.34, r * 0.1); ctx.fillStyle = '#ffe27a'; ctx.fill();
      ctx.restore();
      ctx.strokeStyle = 'rgba(255,246,214,0.85)'; ctx.lineWidth = Math.max(1.6, size * 0.05);
      ctx.beginPath();
      if (ctx.arc) ctx.arc(0, 0, r * 0.95, -2.5, 1.3);
      ctx.stroke();
      // 轨迹箭头
      ctx.beginPath();
      ctx.moveTo(r * 0.62, -r * 0.78); ctx.lineTo(r * 1.2, -r * 0.42); ctx.lineTo(r * 0.56, -r * 0.3);
      ctx.fill();
    } else switch (skill.kind) {
      case 'melee': // 交叉刀光
        ctx.beginPath(); ctx.arc(0, 0, r, -1.2, 1.2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-r * 0.8, r * 0.9); ctx.lineTo(r * 0.8, -r * 0.9); ctx.stroke();
        break;
      case 'dash': { // 前冲箭头
        ctx.beginPath();
        ctx.moveTo(-r, -r * 0.7); ctx.lineTo(r * 0.2, 0); ctx.lineTo(-r, r * 0.7);
        ctx.stroke();
        ctx.globalAlpha = 0.55;
        ctx.beginPath(); ctx.moveTo(-r * 0.1, -r * 0.7); ctx.lineTo(r * 1.05, 0); ctx.lineTo(-r * 0.1, r * 0.7); ctx.stroke();
        ctx.globalAlpha = 1;
        break;
      }
      case 'aoe': // 爆裂环
        ctx.beginPath(); ctx.arc(0, 0, r * 0.45, 0, Math.PI * 2); ctx.stroke();
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * Math.PI * 2;
          line(ctx, Math.cos(a) * r * 0.7, Math.sin(a) * r * 0.7, Math.cos(a) * r * 1.05, Math.sin(a) * r * 1.05, Math.max(1.5, size * 0.05), col);
        }
        break;
      case 'ranged': // 飞弹
        ctx.beginPath(); ctx.arc(r * 0.25, 0, r * 0.42, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 0.5;
        line(ctx, -r, 0, -r * 0.35, 0, Math.max(2, size * 0.08), col);
        ctx.globalAlpha = 1;
        break;
      case 'heal': // 十字
        rr(ctx, -r * 0.24, -r * 0.8, r * 0.48, r * 1.6, r * 0.14); ctx.fill();
        rr(ctx, -r * 0.8, -r * 0.24, r * 1.6, r * 0.48, r * 0.14); ctx.fill();
        break;
      case 'buff': // 上升箭头
        ctx.beginPath();
        ctx.moveTo(0, -r); ctx.lineTo(r * 0.8, 0); ctx.lineTo(r * 0.32, 0);
        ctx.lineTo(r * 0.32, r); ctx.lineTo(-r * 0.32, r); ctx.lineTo(-r * 0.32, 0);
        ctx.lineTo(-r * 0.8, 0); ctx.closePath(); ctx.fill();
        break;
      default:
        circle(ctx, 0, 0, r); ctx.stroke();
    }
    ctx.restore();
    // 冷却遮罩（自上而下）
    if (cdPct > 0) {
      ctx.save();
      rr(ctx, x, y, size, size, size * 0.2); ctx.clip();
      ctx.fillStyle = 'rgba(0,0,0,0.62)';
      ctx.fillRect(x, y, size, size * cdPct);
      ctx.restore();
    }
    ctx.restore();
  };
  function skillColor(skill) {
    switch (skill.kind) {
      case 'melee': return '#ffb35c';
      case 'dash': return '#7fd0ff';
      case 'aoe': return '#ff7b7b';
      case 'ranged': return '#c39bff';
      case 'heal': return '#7CFC9B';
      case 'buff': return '#ffd479';
      default: return '#cfe0f5';
    }
  }

  // ===== 法宝图标（12 件各不同）=====
  Art.drawTreasureIcon = function (ctx, x, y, size, tr, cdPct, owned) {
    const cx = x + size / 2, cy = y + size / 2, r = size * 0.31;
    ctx.save();
    rr(ctx, x, y, size, size, size * 0.2);
    ctx.fillStyle = '#1c1526'; ctx.fill();
    ctx.strokeStyle = owned ? '#d6b3ff' : '#3d3450'; ctx.lineWidth = 2; ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.globalAlpha = owned ? 1 : 0.42;
    const GOLD = '#f4c430', JADE = '#8fe3c0', RED = '#e0675a', BLUE = '#8bc8ff', PURPLE = '#c39bff';
    const pen = (col, w) => { ctx.strokeStyle = col; ctx.lineWidth = Math.max(1.6, w || size * 0.06); ctx.lineCap = 'round'; };

    switch (tr.id) {
      case 'tr_wuxing': { // 五行珠：五色小珠绕圈
        const cols = ['#f4c430', '#7CFC9B', '#8bc8ff', '#e0675a', '#c39bff'];
        for (let i = 0; i < 5; i++) {
          const a = (i / 5) * Math.PI * 2 - Math.PI / 2;
          circle(ctx, Math.cos(a) * r * 0.72, Math.sin(a) * r * 0.72, r * 0.26);
          shape(ctx, cols[i], 1.2);
        }
        circle(ctx, 0, 0, r * 0.26); shape(ctx, '#fff8dc', 1.2);
        break;
      }
      case 'tr_kunxian': { // 捆仙绳：盘起来的绳圈 + 甩出的绳尾
        pen(RED, size * 0.072);
        for (let i = 0; i < 3; i++) {
          const k = 0.82 - i * 0.22;
          ctx.beginPath();
          if (ctx.ellipse) ctx.ellipse(0, r * 0.12, r * k, r * k * 0.66, 0.2, 0, Math.PI * 2);
          else ctx.arc(0, r * 0.1, r * k * 0.8, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.moveTo(r * 0.5, r * 0.28);
        ctx.quadraticCurveTo(r * 1.15, -r * 0.15, r * 0.95, -r * 0.85);
        ctx.stroke();
        circle(ctx, r * 0.95, -r * 0.88, r * 0.12); shape(ctx, RED, 1);
        break;
      }
      case 'tr_bajiao': { // 芭蕉扇
        ctx.beginPath();
        ctx.moveTo(0, r * 0.95);
        ctx.quadraticCurveTo(r * 1.25, r * 0.1, r * 0.35, -r * 0.95);
        ctx.lineTo(-r * 0.35, -r * 0.95);
        ctx.quadraticCurveTo(-r * 1.25, r * 0.1, 0, r * 0.95);
        shape(ctx, JADE, 1.4);
        pen('#2f7d5e', 1.4);
        for (let i = -2; i <= 2; i++) { line(ctx, 0, r * 0.9, i * r * 0.3, -r * 0.85, 1.2, '#2f7d5e'); }
        line(ctx, 0, r * 0.95, 0, r * 1.3, size * 0.06, '#8c6b3f');
        break;
      }
      case 'tr_zijin': { // 紫金铃
        ctx.beginPath();
        ctx.moveTo(-r * 0.7, r * 0.45);
        ctx.quadraticCurveTo(-r * 0.7, -r * 0.85, 0, -r * 0.85);
        ctx.quadraticCurveTo(r * 0.7, -r * 0.85, r * 0.7, r * 0.45);
        ctx.closePath(); shape(ctx, PURPLE, 1.4);
        rr(ctx, -r * 0.85, r * 0.4, r * 1.7, r * 0.24, r * 0.1); shape(ctx, GOLD, 1.2);
        circle(ctx, 0, r * 0.8, r * 0.16); shape(ctx, GOLD, 1);
        break;
      }
      case 'tr_qixing': { // 七星剑
        ctx.beginPath();
        ctx.moveTo(0, -r * 1.05); ctx.lineTo(r * 0.22, -r * 0.55);
        ctx.lineTo(r * 0.22, r * 0.35); ctx.lineTo(-r * 0.22, r * 0.35);
        ctx.lineTo(-r * 0.22, -r * 0.55); ctx.closePath();
        shape(ctx, '#dbe7f5', 1.3);
        rr(ctx, -r * 0.75, r * 0.32, r * 1.5, r * 0.16, r * 0.06); shape(ctx, GOLD, 1);
        rr(ctx, -r * 0.1, r * 0.46, r * 0.2, r * 0.5, r * 0.08); shape(ctx, '#8c6b3f', 1);
        ctx.fillStyle = '#ffe27a';
        for (let i = 0; i < 3; i++) { circle(ctx, 0, -r * 0.7 + i * r * 0.32, r * 0.07); ctx.fill(); }
        break;
      }
      case 'tr_yujing': { // 玉净瓶
        ctx.beginPath();
        ctx.moveTo(-r * 0.28, -r * 0.9); ctx.lineTo(r * 0.28, -r * 0.9);
        ctx.lineTo(r * 0.28, -r * 0.4);
        ctx.quadraticCurveTo(r * 0.85, r * 0.1, r * 0.55, r * 0.9);
        ctx.lineTo(-r * 0.55, r * 0.9);
        ctx.quadraticCurveTo(-r * 0.85, r * 0.1, -r * 0.28, -r * 0.4);
        ctx.closePath(); shape(ctx, '#eaf6ff', 1.4);
        pen(JADE, 1.3);
        line(ctx, -r * 0.18, -r * 0.95, -r * 0.5, -r * 1.3, 1.6, JADE);
        break;
      }
      case 'tr_fenghuo': { // 风火轮
        circle(ctx, 0, 0, r * 0.85); shape(ctx, 'rgba(224,103,90,0.85)', 1.4);
        pen(GOLD, 1.4);
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * Math.PI * 2;
          line(ctx, 0, 0, Math.cos(a) * r * 0.8, Math.sin(a) * r * 0.8, 1.6, GOLD);
        }
        circle(ctx, 0, 0, r * 0.22); shape(ctx, GOLD, 1);
        break;
      }
      case 'tr_hulu': { // 红葫芦
        circle(ctx, 0, r * 0.35, r * 0.55); shape(ctx, RED, 1.4);
        circle(ctx, 0, -r * 0.35, r * 0.36); shape(ctx, RED, 1.4);
        rr(ctx, -r * 0.16, -r * 0.95, r * 0.32, r * 0.3, r * 0.08); shape(ctx, GOLD, 1);
        break;
      }
      case 'tr_huntian': { // 混天绫：飘带
        pen('#ff8fb1', size * 0.09);
        ctx.beginPath();
        ctx.moveTo(-r, -r * 0.5);
        ctx.quadraticCurveTo(-r * 0.2, -r * 1.1, r * 0.4, -r * 0.2);
        ctx.quadraticCurveTo(r * 0.9, r * 0.5, -r * 0.2, r * 0.55);
        ctx.quadraticCurveTo(-r * 0.8, r * 0.6, -r * 0.9, r * 1.0);
        ctx.stroke();
        break;
      }
      case 'tr_qiankun': { // 乾坤圈
        pen(GOLD, size * 0.09);
        ctx.beginPath(); ctx.arc(0, 0, r * 0.78, 0, Math.PI * 2); ctx.stroke();
        pen('#b8860b', 1.2);
        ctx.beginPath(); ctx.arc(0, 0, r * 0.5, 0, Math.PI * 2); ctx.stroke();
        break;
      }
      case 'tr_jingang': { // 金刚琢
        pen('#dfe6ee', size * 0.1);
        ctx.beginPath(); ctx.arc(0, 0, r * 0.75, 0, Math.PI * 2); ctx.stroke();
        circle(ctx, 0, -r * 0.75, r * 0.22); shape(ctx, BLUE, 1.2);
        break;
      }
      case 'tr_dingfeng': { // 定风丹
        circle(ctx, 0, 0, r * 0.6); shape(ctx, '#eaf6ff', 1.4);
        pen(JADE, 1.3);
        ctx.beginPath(); ctx.arc(0, 0, r * 0.32, 0.4, Math.PI * 1.6); ctx.stroke();
        break;
      }
      default: {
        circle(ctx, 0, 0, r * 0.7); shape(ctx, PURPLE, 1.3);
      }
    }
    ctx.restore();

    if (cdPct > 0) {
      ctx.save();
      rr(ctx, x, y, size, size, size * 0.2); ctx.clip();
      ctx.fillStyle = 'rgba(0,0,0,0.62)';
      ctx.fillRect(x, y, size, size * cdPct);
      ctx.restore();
    }
    ctx.restore();
  };

  // ===== 材料图标 =====
  Art.drawMaterialIcon = function (ctx, x, y, size, itemId) {
    const cx = x + size / 2, cy = y + size / 2, r = size * 0.32;
    ctx.save();
    rr(ctx, x, y, size, size, size * 0.22);
    ctx.fillStyle = '#141a26'; ctx.fill();
    ctx.strokeStyle = '#33405c'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.translate(cx, cy);
    switch (itemId) {
      case 'mat_wood': // 桃木
        rr(ctx, -r * 0.9, -r * 0.3, r * 1.8, r * 0.6, r * 0.28); shape(ctx, '#8c6b3f', 1.2);
        circle(ctx, r * 0.75, 0, r * 0.18); shape(ctx, '#e8d3a8', 1);
        break;
      case 'mat_stone': // 玄石
        ctx.beginPath();
        ctx.moveTo(-r * 0.85, r * 0.5); ctx.lineTo(-r * 0.3, -r * 0.75);
        ctx.lineTo(r * 0.6, -r * 0.5); ctx.lineTo(r * 0.9, r * 0.45);
        ctx.closePath(); shape(ctx, '#9aa6b2', 1.2);
        break;
      case 'mat_herb': // 灵草
        line(ctx, 0, r * 0.9, 0, -r * 0.3, 2.2, '#3f7a4a');
        ctx.beginPath();
        ctx.moveTo(0, -r * 0.2); ctx.quadraticCurveTo(r * 0.95, -r * 0.35, r * 0.35, -r * 0.95);
        ctx.quadraticCurveTo(r * 0.15, -r * 0.4, 0, -r * 0.2);
        shape(ctx, '#7CFC9B', 1);
        ctx.beginPath();
        ctx.moveTo(0, r * 0.15); ctx.quadraticCurveTo(-r * 0.95, 0, -r * 0.35, -r * 0.6);
        ctx.quadraticCurveTo(-r * 0.15, -r * 0.05, 0, r * 0.15);
        shape(ctx, '#5ec97a', 1);
        break;
      case 'mat_fire': // 火晶
        ctx.beginPath();
        ctx.moveTo(0, -r); ctx.quadraticCurveTo(r * 0.8, r * 0.1, r * 0.2, r * 0.85);
        ctx.quadraticCurveTo(0, r * 0.3, -r * 0.2, r * 0.85);
        ctx.quadraticCurveTo(-r * 0.8, r * 0.1, 0, -r);
        shape(ctx, '#ff8a3d', 1.2);
        ctx.beginPath();
        ctx.moveTo(0, -r * 0.2); ctx.quadraticCurveTo(r * 0.3, r * 0.3, 0, r * 0.7);
        ctx.quadraticCurveTo(-r * 0.3, r * 0.3, 0, -r * 0.2);
        shape(ctx, '#ffd479', 0);
        break;
      case 'mat_soul': // 妖魂
        circle(ctx, 0, 0, r * 0.62); shape(ctx, 'rgba(195,155,255,0.9)', 1.2);
        circle(ctx, -r * 0.18, -r * 0.12, r * 0.1); ctx.fillStyle = '#2b1a3d'; ctx.fill();
        circle(ctx, r * 0.18, -r * 0.12, r * 0.1); ctx.fillStyle = '#2b1a3d'; ctx.fill();
        break;
      default:
        circle(ctx, 0, 0, r * 0.6); shape(ctx, '#9fb0c8', 1.2);
    }
    ctx.restore();
  };

  // 装备图标（武器/护甲/饰品）
  Art.drawEquipIcon = function (ctx, x, y, size, item) {
    const cx = x + size / 2, cy = y + size / 2, r = size * 0.31;
    ctx.save();
    rr(ctx, x, y, size, size, size * 0.2);
    ctx.fillStyle = '#141a26'; ctx.fill();
    ctx.strokeStyle = '#5a4a7a'; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.translate(cx, cy);
    if (item && item.slot === 'armor') {
      ctx.beginPath();
      ctx.moveTo(-r * 0.8, -r * 0.7); ctx.lineTo(-r * 0.25, -r * 0.95);

        x0 + step * (0.42 + r2 * 0.24), baseY - peak * (0.62 + r2 * 0.46),
        x0 + step, baseY - amp * (0.05 + r2 * 0.2)
      );
    }
    ctx.lineTo(W + 200, H + 60);
    ctx.closePath();
    ctx.fill();
  }

  // ---------- 中式屋顶（反宇飞檐：檐口远宽于墙身，两端上翘） ----------
  function eaveRoof(ctx, w, h, fill) {
    const eaveY = -h * 0.7;
    const ridgeY = -h * 1.0;
    const hb = w * 0.94;
    const ht = w * 0.2;
    const lift = h * 0.1;
    const thick = Math.max(5, h * 0.09);

    ctx.fillStyle = fill;
    ctx.beginPath();
    // 上表面：右檐角 → 屋脊 → 左檐角（反宇曲线）
    ctx.moveTo(hb, eaveY - lift);
    ctx.quadraticCurveTo(hb * 0.46, eaveY - h * 0.44, ht, ridgeY);
    ctx.lineTo(-ht, ridgeY);
    ctx.quadraticCurveTo(-hb * 0.46, eaveY - h * 0.44, -hb, eaveY - lift);
    // 檐板下缘（微凸，形成厚度）
    ctx.lineTo(-hb * 0.72, eaveY - lift + thick * 1.3);
    ctx.quadraticCurveTo(0, eaveY + thick * 2.4, hb * 0.72, eaveY - lift + thick * 1.3);
    ctx.closePath();
    ctx.fill();

    // 正脊
    ctx.strokeStyle = 'rgba(255,214,150,0.45)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-ht - w * 0.05, ridgeY - h * 0.015);
    ctx.lineTo(ht + w * 0.05, ridgeY - h * 0.015);
    ctx.stroke();
    // 脊端鸱吻（小翘角）
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(-ht - w * 0.05, ridgeY);
    ctx.quadraticCurveTo(-ht - w * 0.19, ridgeY - h * 0.09, -ht - w * 0.09, ridgeY - h * 0.2);
    ctx.lineTo(-ht, ridgeY);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(ht + w * 0.05, ridgeY);
    ctx.quadraticCurveTo(ht + w * 0.19, ridgeY - h * 0.09, ht + w * 0.09, ridgeY - h * 0.2);
    ctx.lineTo(ht, ridgeY);
    ctx.closePath(); ctx.fill();
    // 檐下阴影
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.moveTo(-hb * 0.7, eaveY - lift + thick * 1.2);
    ctx.quadraticCurveTo(0, eaveY + thick * 2.2, hb * 0.7, eaveY - lift + thick * 1.2);
    ctx.lineTo(hb * 0.7, eaveY - lift + thick * 1.2 + 4);
    ctx.quadraticCurveTo(0, eaveY + thick * 2.4 + 4, -hb * 0.7, eaveY - lift + thick * 1.2 + 4);
    ctx.closePath();
    ctx.fill();
  }

  // 一座宫殿：台基 + 柱列 + 墙 + 飞檐（可带断口）
  function hall(ctx, x, y, w, h, broken, tumble) {
    const INK = '#17293a', INK2 = '#20374b';
    ctx.save();
    ctx.translate(x, y);
    if (tumble) ctx.rotate(tumble);
    ctx.fillStyle = INK;
    // 台基
    ctx.fillRect(-w * 0.72, -6, w * 1.44, 7);
    ctx.fillStyle = INK2;
    ctx.fillRect(-w * 0.72, -6, w * 1.44, 2);
    // 柱
    ctx.fillStyle = INK;
    const cols = 4;
    for (let i = 0; i < cols; i++) {
      const cxp = -w * 0.44 + (w * 0.88 / (cols - 1)) * i;
      const ch = broken && i > 1 ? h * 0.62 : h * 0.86;
      ctx.fillRect(cxp - 2.2, -ch, 4.4, ch - 6);
    }
    // 墙体（破损时留出缺口）
    ctx.beginPath();
    ctx.moveTo(-w * 0.5, -4);
    ctx.lineTo(-w * 0.5, -h * 0.92);
    if (broken) {
      ctx.lineTo(-w * 0.18, -h * 0.72);
      ctx.lineTo(w * 0.06, -h * 0.96);
      ctx.lineTo(w * 0.3, -h * 0.68);
      ctx.lineTo(w * 0.5, -h * 0.88);
    } else {
      ctx.lineTo(-w * 0.5, -h * 0.96);
      ctx.lineTo(w * 0.5, -h * 0.96);
    }
    ctx.lineTo(w * 0.5, -4);
    ctx.closePath();
    ctx.fillStyle = INK;
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fill();
    // 窗（残存的暖光）
    ctx.fillStyle = 'rgba(255,186,104,0.26)';
    ctx.fillRect(-w * 0.34, -h * 0.6, w * 0.16, h * 0.22);
    ctx.fillRect(w * 0.1, -h * 0.54, w * 0.16, h * 0.2);
    // 飞檐
    eaveRoof(ctx, w, h, INK);
    ctx.restore();
  }

  // 南天门：整体倾斜，右柱断裂错位，横梁一头下垂
  function southGate(ctx, x, y, tilt) {
    const INK = '#17293a';
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(tilt);

    // 台基（两级）
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.moveTo(-80, 0); ctx.lineTo(80, -4); ctx.lineTo(72, 11); ctx.lineTo(-72, 14);
    ctx.closePath(); ctx.fill();

    // 左柱
    ctx.fillRect(-60, -132, 17, 130);
    ctx.fillRect(-69, -140, 35, 10);
    ctx.fillRect(-67, -9, 31, 10);

    // 右柱：下段完整，上段断裂错位
    ctx.fillRect(44, -9, 17, 63);
    ctx.fillRect(35, -14, 35, 10);
    ctx.save();
    ctx.translate(7, -9);
    ctx.rotate(0.13);
    ctx.fillRect(44, -58, 17, 52);
    ctx.fillRect(35, -67, 35, 10);
    ctx.restore();

    // 横梁（右端下垂，两端出头）
    ctx.beginPath();
    ctx.moveTo(-84, -150);
    ctx.lineTo(72, -130);
    ctx.lineTo(70, -113);
    ctx.lineTo(-82, -133);
    ctx.closePath(); ctx.fill();
    // 斗拱
    for (let i = 0; i < 6; i++) ctx.fillRect(-72 + i * 27, -138 + i * 3.3, 13, 9);

    // 匾额（挂在横梁正中，带金框）
    ctx.save();
    ctx.translate(-4, -134);
    ctx.rotate(0.08);
    ctx.fillStyle = '#1d3346';
    ctx.fillRect(-36, -24, 72, 28);
    ctx.strokeStyle = 'rgba(255,206,128,0.55)';
    ctx.lineWidth = 1.6;
    ctx.strokeRect(-36, -24, 72, 28);
    ctx.fillStyle = 'rgba(255,206,128,0.8)';
    for (let i = 0; i < 3; i++) ctx.fillRect(-26 + i * 21, -15, 14, 12);
    ctx.restore();

    // 逆光亮边
    ctx.strokeStyle = 'rgba(255,214,150,0.45)';
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(-52, -140); ctx.lineTo(-52, 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-84, -150); ctx.lineTo(72, -130); ctx.stroke();

    // 坠落中的碎石
    ctx.fillStyle = '#22394c';
    ctx.fillRect(48, 26, 7, 6);
    ctx.fillRect(58, 50, 6, 5);
    ctx.fillRect(34, 72, 5, 5);
    ctx.restore();
  }

  function heavenRuins(ctx, cx, baseY, t) {
    const INK = '#17293a';
    ctx.save();
    ctx.translate(cx, baseY);

    // 悬浮碎块（在台基后方远处）
    const frags = [[-286, -76, 14], [268, -104, 11], [-176, -152, 9], [300, 6, 9], [-320, -18, 8], [150, -186, 8]];
    for (let i = 0; i < frags.length; i++) {
      const f = frags[i];
      const fy = f[1] + Math.sin(t / 1100 + i * 1.7) * 6;
      ctx.save();
      ctx.translate(f[0], fy);
      ctx.rotate(Math.sin(t / 1700 + i) * 0.28);
      ctx.fillStyle = '#1b3042';
      ctx.beginPath();
      ctx.moveTo(-f[2], -f[2] * 0.4);
      ctx.lineTo(f[2] * 0.5, -f[2]);
      ctx.lineTo(f[2], f[2] * 0.4);
      ctx.lineTo(-f[2] * 0.4, f[2] * 0.9);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // 参差的碎裂台基
    ctx.beginPath();
    ctx.moveTo(-224, 2);
    ctx.lineTo(-160, -5);
    ctx.lineTo(-66, 0);
    ctx.lineTo(32, -7);
    ctx.lineTo(134, -1);
    ctx.lineTo(226, 5);
    ctx.lineTo(206, 24);
    ctx.lineTo(158, 37);
    ctx.lineTo(108, 28);
    ctx.lineTo(58, 49);
    ctx.lineTo(12, 31);
    ctx.lineTo(-40, 41);
    ctx.lineTo(-94, 25);
    ctx.lineTo(-150, 34);
    ctx.lineTo(-206, 19);
    ctx.closePath();
    ctx.fillStyle = INK;
    ctx.fill();
    // 台面逆光边
    ctx.strokeStyle = 'rgba(255,214,150,0.38)';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(-224, 2); ctx.lineTo(-160, -5); ctx.lineTo(-66, 0);
    ctx.lineTo(32, -7); ctx.lineTo(134, -1); ctx.lineTo(226, 5);
    ctx.stroke();
    // 台面砖缝
    ctx.strokeStyle = 'rgba(120,152,172,0.2)';
    ctx.lineWidth = 1;
    for (let i = -5; i <= 5; i++) {
      ctx.beginPath(); ctx.moveTo(i * 40, -1); ctx.lineTo(i * 36, 22); ctx.stroke();
    }

    // 建筑：配殿 / 主殿 / 残殿
    hall(ctx, -128, -1, 96, 64, false, -0.02);
    hall(ctx, 14, -2, 140, 92, true, 0.012);
    hall(ctx, 168, -1, 86, 52, true, 0.06);

    // 南天门脚下的独立浮岩
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.moveTo(-346, 4); ctx.lineTo(-330, -6); ctx.lineTo(-232, -2);
    ctx.lineTo(-226, 14); ctx.lineTo(-268, 32); ctx.lineTo(-320, 24);
    ctx.closePath(); ctx.fill();

    // 南天门（更夸张的倾斜）
    southGate(ctx, -286, -2, -0.12);

    // 向外悬伸的断桥
    ctx.save();
    ctx.translate(232, -2);
    ctx.rotate(-0.16);
    ctx.fillStyle = INK;
    ctx.fillRect(0, 0, 92, 8);
    ctx.fillRect(8, 8, 7, 18);
    ctx.fillRect(40, 8, 7, 26);
    ctx.fillRect(74, 8, 7, 15);
    ctx.fillStyle = 'rgba(255,214,150,0.3)';
    ctx.fillRect(0, 0, 92, 2);
    ctx.restore();

    // 悬空断阶（从台基左侧向下延伸，像被炸断的天梯）
    ctx.fillStyle = '#1a2f40';
    for (let i = 0; i < 3; i++) {
      ctx.save();
      ctx.translate(-250 - i * 34, 22 + i * 30);
      ctx.rotate(-0.24 + i * 0.1);
      ctx.fillRect(0, 0, 46, 7);
      ctx.restore();
    }
    ctx.restore();
  }

  // 瀑布（水带 + 流动高光 + 潭底水雾）
  function waterfall(ctx, x, yTop, yBot, w, t) {
    ctx.fillStyle = 'rgba(216,238,248,0.22)';
    ctx.beginPath();
    ctx.moveTo(x - w * 0.42, yTop);
    ctx.quadraticCurveTo(x - w * 0.56, (yTop + yBot) * 0.5, x - w * 0.88, yBot);
    ctx.lineTo(x + w * 0.88, yBot);
    ctx.quadraticCurveTo(x + w * 0.56, (yTop + yBot) * 0.5, x + w * 0.42, yTop);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 1.6;
    for (let i = 0; i < 5; i++) {
      const p = (t / 1100 + i * 0.21) % 1;
      const yy = yTop + (yBot - yTop) * p;
      const xx = x + (i - 2) * w * 0.28 + Math.sin(t / 520 + i) * 2;
      ctx.beginPath(); ctx.moveTo(xx, yy); ctx.lineTo(xx, yy + 15); ctx.stroke();
    }
    softBlob(ctx, x, yBot + 4, w * 1.6, null, [[0, 'rgba(226,244,250,0.34)'], [1, 'rgba(226,244,250,0)']]);
  }

  // 桃树剪影
  function peachTree(ctx, x, y, sc, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(sc, sc);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(-6, 0);
    ctx.quadraticCurveTo(-4, -22, -11, -36);
    ctx.lineTo(-4, -38);
    ctx.quadraticCurveTo(2, -22, 6, 0);
    ctx.closePath();
    ctx.fill();
    // 枝
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(-6, -32); ctx.lineTo(-24, -46); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -34); ctx.lineTo(20, -50); ctx.stroke();
    const blobs = [[-30, -52, 15], [-12, -62, 19], [10, -60, 17], [28, -52, 14], [0, -44, 15]];
    for (let i = 0; i < blobs.length; i++) ell(ctx, blobs[i][0], blobs[i][1], blobs[i][2], blobs[i][2] * 0.86);
    ctx.restore();
  }

  // ========== 场景一：花果山 · 云上天宫废墟 ==========
  function sceneMountain(ctx, t, camX) {
    ctx.fillStyle = grad(ctx, 0, H, [
      [0, '#0e2742'], [0.26, '#2c5b78'], [0.5, '#6a90a0'],
      [0.68, '#c3a97f'], [0.84, '#7d7a66'], [1, '#0e1a24'],
    ]);
    ctx.fillRect(0, 0, W, H);

    // 日轮（位于废墟后方，形成逆光）
    const sunX = 716, sunY = 156;
    softBlob(ctx, sunX, sunY, 300, null, [
      [0, 'rgba(255,232,176,0.55)'], [0.22, 'rgba(255,206,140,0.28)'],
      [0.55, 'rgba(255,170,96,0.1)'], [1, 'rgba(255,150,80,0)'],
    ]);
    ctx.fillStyle = 'rgba(255,238,196,0.9)';
    ctx.beginPath(); ctx.arc(sunX, sunY, 44, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,248,0.85)';
    ctx.beginPath(); ctx.arc(sunX - 8, sunY - 8, 24, 0, Math.PI * 2); ctx.fill();

    // 云海上方的天宫废墟
    heavenRuins(ctx, 616 - camX * 0.08, 278, t);

    // 云海：三层，最下一层暖白，越往上越淡
    cloudBand(ctx, 272, t * 5 + camX * 0.09, 'rgba(206,220,232,0.28)', 0.9);
    cloudBand(ctx, 302, t * 9 + camX * 0.15, 'rgba(228,232,232,0.36)', 1.15);
    cloudBand(ctx, 342, t * 15 + camX * 0.24, 'rgba(248,244,234,0.42)', 1.5);
    softBlob(ctx, 480, 300, 320, null, [[0, 'rgba(255,226,180,0.16)'], [1, 'rgba(255,226,180,0)']]);

    // 远山（雾中两层，刻意压低对比度）
    ridge(ctx, 408, 'rgba(52,86,102,0.7)', camX, 0.14, 5, 104, 190);
    ridge(ctx, 456, '#2b5060', camX, 0.24, 11, 88, 165);
    // 中景主山（花果山本体）
    ridge(ctx, 502, '#1b3543', camX, 0.36, 2, 68, 150);

    // 崖壁 + 瀑布
    const wx = 268 - camX * 0.36;
    ctx.fillStyle = '#132832';
    ctx.beginPath();
    ctx.moveTo(wx - 118, 540);
    ctx.lineTo(wx - 92, 470);
    ctx.lineTo(wx - 54, 412);
    ctx.lineTo(wx - 16, 396);
    ctx.lineTo(wx + 26, 414);
    ctx.lineTo(wx + 56, 470);
    ctx.lineTo(wx + 74, 540);
    ctx.closePath();
    ctx.fill();
    // 岩层
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fillRect(wx - 70, 452, 130, 3);
    ctx.fillRect(wx - 52, 486, 104, 2);
    waterfall(ctx, wx + 2, 400, 508, 24, t);

    // 近景桃树
    peachTree(ctx, 74 - camX * 0.52, 524, 1.3, '#0d1e26');
    peachTree(ctx, 906 - camX * 0.52, 526, 1.1, '#0f2230');

    // 花瓣
    for (let i = 0; i < 11; i++) {
      const px = ((i * 137 + t * 14) % (W + 80)) - 40;
      const py = ((i * 103 + t * 30) % (H + 60)) - 30;
      ctx.fillStyle = 'rgba(255,206,222,0.42)';
      ctx.beginPath(); ctx.arc(px, py, 2.1, 0, Math.PI * 2); ctx.fill();
    }
  }

  // ========== 场景二：黑风洞 ==========
  function sceneCave(ctx, t, camX) {
    ctx.fillStyle = grad(ctx, 0, H, [[0, '#1c132c'], [0.42, '#140e22'], [1, '#06040a']]);
    ctx.fillRect(0, 0, W, H);

    // 深处的洞府石门（黑熊精老巢）：两侧石柱 + 门楣 + 拱形门洞
    const gx = 690 - camX * 0.1, gy = 318;
    softBlob(ctx, gx, gy - 70, 380, null, [
      [0, 'rgba(120,214,172,0.22)'], [0.42, 'rgba(56,132,116,0.12)'], [1, 'rgba(0,0,0,0)'],
    ]);

    ctx.fillStyle = '#191228';
    ctx.fillRect(gx - 140, gy - 186, 42, 186);
    ctx.fillRect(gx + 98, gy - 186, 42, 186);
    ctx.fillRect(gx - 162, gy - 210, 324, 32);
    // 石柱逆光边（幽绿冷光）
    ctx.fillStyle = 'rgba(120,214,178,0.22)';
    ctx.fillRect(gx - 140, gy - 186, 3, 186);
    ctx.fillRect(gx + 137, gy - 186, 3, 186);
    ctx.fillRect(gx - 162, gy - 210, 324, 3);
    // 柱身砖缝
    ctx.strokeStyle = 'rgba(126,158,190,0.11)';
    ctx.lineWidth = 1.5;
    for (let i = 1; i < 6; i++) {
      const yy = gy - 186 + i * 31;
      ctx.beginPath(); ctx.moveTo(gx - 140, yy); ctx.lineTo(gx - 98, yy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(gx + 98, yy); ctx.lineTo(gx + 140, yy); ctx.stroke();
    }
    // 门洞
    ctx.fillStyle = '#05030a';
    ctx.beginPath();
    ctx.moveTo(gx - 96, gy);
    ctx.lineTo(gx - 96, gy - 128);
    ctx.quadraticCurveTo(gx, gy - 192, gx + 96, gy - 128);
    ctx.lineTo(gx + 96, gy);
    ctx.closePath();
    ctx.fill();
    // 门内幽光
    const dg = radial(ctx, gx, gy - 44, 136, [
      [0, 'rgba(120,220,180,0.16)'], [0.5, 'rgba(60,150,124,0.08)'], [1, 'rgba(0,0,0,0)'],
    ]);
    if (dg) { ctx.fillStyle = dg; ctx.fillRect(gx - 136, gy - 180, 272, 200); }
    // 门楣牌匾
    ctx.fillStyle = '#161026';
    ctx.fillRect(gx - 46, gy - 204, 92, 26);
    ctx.strokeStyle = 'rgba(126,214,178,0.34)';
    ctx.lineWidth = 1.6;
    ctx.strokeRect(gx - 46, gy - 204, 92, 26);
    ctx.fillStyle = 'rgba(126,214,178,0.42)';
    for (let i = 0; i < 2; i++) ctx.fillRect(gx - 24 + i * 32, gy - 198, 17, 13);

    // 风眼旋涡（黑色风带 + 几点碎光，读起来像"卷"的东西）
    ctx.save();
    ctx.translate(gx, gy - 58);
    for (let arm = 0; arm < 3; arm++) {
      ctx.save();
      ctx.rotate(t / 2200 + (arm * Math.PI * 2) / 3);
      for (let k = 0; k < 2; k++) {
        ctx.strokeStyle = k === 0 ? 'rgba(140,240,196,0.26)' : 'rgba(80,170,146,0.18)';
        ctx.lineWidth = k === 0 ? 7 : 12;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(8 + k * 6, 0);
        ctx.quadraticCurveTo(44, -10, 66, 16);
        ctx.quadraticCurveTo(84, 38, 60, 54);
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.restore();

    // 洞顶钟乳石（疏密不一，避免等距三角）
    const offTop = camX * 0.07;
    ctx.fillStyle = '#0b0714';
    ctx.beginPath();
    ctx.moveTo(-80, -30);
    let cx2 = -80;
    const lens = [34, 78, 22, 54, 96, 30, 68, 44, 110, 26, 60, 40, 84, 20];
    for (let i = 0; i < lens.length; i++) {
      const wid = 34 + ((i * 29) % 46);
      const hh = lens[i];
      ctx.lineTo(cx2 + wid * 0.25, hh * 0.7);
      ctx.lineTo(cx2 + wid * 0.52, hh);
      ctx.lineTo(cx2 + wid * 0.78, hh * 0.45);
      cx2 += wid;
    }
    ctx.lineTo(cx2 + 120, -30);
    ctx.closePath();
    ctx.fill();

    // 洞壁石幔（两侧）
    ctx.fillStyle = '#0f0a1a';
    for (let s = 0; s < 2; s++) {
      const dir = s === 0 ? 1 : -1;
      const bx = s === 0 ? -40 - camX * 0.18 : W + 40 - camX * 0.18;
      ctx.beginPath();
      ctx.moveTo(bx, -30);
      ctx.quadraticCurveTo(bx + dir * 120, 150, bx + dir * 58, 300);
      ctx.quadraticCurveTo(bx + dir * 130, 400, bx + dir * 44, 540);
      ctx.lineTo(bx - dir * 90, 540);
      ctx.lineTo(bx - dir * 90, -30);
      ctx.closePath();
      ctx.fill();
    }

    // 中景石笋
    const pillars = [[168, 176, 34], [410, 108, 22], [596, 224, 38], [864, 148, 26]];

    emitFx(type, data) {
      if (!this.fxQueue) this.fxQueue = [];
      if (this.fxQueue.length < 60) this.fxQueue.push({ type: type, data: data || null });
    }
    get sprinting() { return this.runDir !== 0; }
    get speedMul() { return (this.now < this.buffSpdUntil) ? 1.5 : 1; }
    get atkMul() { return (this.now < this.buffAtkUntil) ? 1.4 : 1; }
    get defMul() { return (this.now < this.buffDefUntil) ? 2 : 1; }

    update(dt, input, level, now) {
      this.now = now;
      this.animT += dt * 1000;
      // 水平移动（A/D 或 ←/→）
      let dir = 0;
      const tapLeft = anyPressed(input, KEYS.left);
      const tapRight = anyPressed(input, KEYS.right);
      if (anyDown(input, KEYS.left)) dir -= 1;
      if (anyDown(input, KEYS.right)) dir += 1;

      // 同一方向在 320ms 内连按两次 → 进入奔跑

      }

          attackP: this._dbgAtk.p, attackKind: this._dbgAtk.k,
          attackPath: this._dbgAtk.path, attackBody: this._dbgAtk.body,
          castP: undefined, hurtP: undefined, castId: null,
          noWeapon: false, combo: this._dbgAtk.k, sprint: false,

      const cast = now < this.castUntil ? (now - this.castStart) / Math.max(1, this.castUntil - this.castStart) : undefined;
      const hurtP = now < (this.hurtUntil || -9999) ? (now - this.hurtStart) / Math.max(1, this.hurtUntil - this.hurtStart) : undefined;

      this.hp = o.fullHeal ? this.maxHp : Math.max(1, Math.round(this.maxHp * ratio));

        if (this.progress) { this.progress.level = this.level; this.progress.exp = this.exp; }
        if (game) {
          game.toast('升到 ' + this.level + ' 级！气血全满');
          if (game.fx) game.fx.levelUp(this.x + this.w / 2, this.y + this.h);
          if (game.expPops) game.expPops.push({ text: 'LEVEL UP! Lv.' + this.level, life: 1.6, color: '#ffd479' });
          if (XY.Audio) XY.Audio.sfx('levelup');
          if (game.save) game.save();
        }
      } else if (this.progress) {
        this.progress.exp = this.exp;
      }

    }
  };

  // ===== 敌人 =====
  XY.makeEnemy = function (kind, x, y, levelNum) {

    if (kind === 'boss') {

      const boss = new XY.Enemy('boss', {
        name: b.name, maxHp: Math.round(b.hp * f), hp: Math.round(b.hp * f),
        attack: Math.round(b.attack * f), defense: Math.round(b.defense * f),

  };

  XY.Enemy = class {
    constructor(kind, stats, x, y, w, h) {
      this.kind = kind;
      this.stats = stats;
      this.name = stats.name;
      this.w = w; this.h = h;
      this.x = x; this.y = y;
      this.vx = 0; this.vy = 0;

      const dx = (player.x + player.w / 2) - (this.x + this.w / 2);
      const dist = Math.abs(dx);
      if (dist < this.stats.aggroRange) {
        this.facing = dx >= 0 ? 1 : -1;
        this.vx = approach(this.vx, this.facing * this.stats.moveSpeed, this.stats.moveSpeed * 8 * dt);
      } else {
        this.vx = approach(this.vx, 0, this.stats.moveSpeed * 8 * dt);

      XY.moveAndCollide(this, level.platforms, dt);

      this.x = Math.max(0, Math.min(level.width - this.w, this.x));
      if (this.y > level.height + 160) { this.y = -80; this.vy = 0; this.x = Math.max(0, Math.min(level.width - this.w, this.x)); }

          this.hp = Math.max(0, (Number.isFinite(this.hp) ? this.hp : this.maxHp) - 12);
          this.hitFlash = 0.1;
          if (this.hp <= 0) this.pendingKill = true; // 交给 game 走统一掉落/经验结算
        }

    }
  };

  // ===== 弹道（远程技能/法宝）=====
  XY.Projectile = class {
    constructor(x, y, vx, vy, damage, owner, radius, color, life) {
      this.x = x; this.y = y; this.vx = vx; this.vy = vy;
      this.damage = damage; this.owner = owner; // 'player' | 'enemy'

      }
    }
  };

  // ===== 关卡运行时 =====
  XY.Level = class {
    constructor(data) {
      this.data = data;
      this.name = data.name;
      this.width = data.width; this.height = data.height;
      this.platforms = data.platforms.map((p) => ({ x: p[0], y: p[1], w: p[2], h: p[3] }));
      this.goal = data.goal;
      this.hasBoss = data.spawns.some((s) => s.type === 'boss');
      this.enemies = data.spawns.map((s) => {
        const e = XY.makeEnemy(s.type, s.x, s.y, s.level);
        XY.liftOutOfPlatforms(e, this.platforms);

    <script>
/* ===== ui.js ===== */
// 渲染层：背景 / 世界 / HUD / 背包 / 各类界面。挂到 XY.UI。纯绘制，不处理逻辑。

      ctx.fillStyle = st.lit;
      ctx.fillRect(p.x, p.y, p.w, 2);

      if (st.deco === 'grass') {
        ctx.strokeStyle = st.lit;
        ctx.lineWidth = 2;
        for (let x = p.x + 7; x < p.x + p.w; x += 32) {
          const hh = 4 + (Math.abs(Math.sin(x * 0.9) * 7919) % 1) * 6;
          ctx.beginPath();
          ctx.moveTo(x, p.y);
          ctx.quadraticCurveTo(x + 1.5, p.y - hh * 0.6, x + 3.5, p.y - hh);
          ctx.stroke();
        }
      } else if (st.deco === 'moss') {
        for (let x = p.x + 10; x < p.x + p.w; x += 41) {
          const rr = Math.abs(Math.sin(x * 2.3) * 4021.7) % 1;
          ctx.fillStyle = 'rgba(126,214,178,' + (0.12 + rr * 0.18).toFixed(2) + ')';
          ctx.beginPath();
          ctx.arc(x, p.y - 2 - rr * 3, 2.2 + rr * 2.6, 0, Math.PI * 2);
          ctx.fill();
        }
      } else {
        // 熔岩裂缝（发光）
        for (let x = p.x + 34; x < p.x + p.w; x += 78) {
          const rr = Math.abs(Math.sin(x * 3.1) * 6131.7) % 1;
          ctx.strokeStyle = 'rgba(255,138,48,0.85)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x, p.y + 4);
          ctx.lineTo(x + (rr - 0.5) * 16, p.y + 12 + rr * 10);
          ctx.lineTo(x + (rr - 0.5) * 24, p.y + p.h - 2);
          ctx.stroke();
          ctx.strokeStyle = 'rgba(255,196,110,0.4)';
          ctx.lineWidth = 4;
          ctx.stroke();
        }
      }
    }
  };

  UI.drawGoal = function (ctx, game) {
    const gx = game.level.goal.x, gy = game.level.goal.y;
    ctx.strokeStyle = '#e8e2d0'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx, gy - 84); ctx.stroke();
    // 旗面（飘动）
    const flap = Math.sin(game.now / 260) * 4;
    ctx.beginPath();
    ctx.moveTo(gx, gy - 84);
    ctx.quadraticCurveTo(gx + 26, gy - 78 + flap, gx + 46, gy - 70);
    ctx.lineTo(gx + 44, gy - 44);
    ctx.quadraticCurveTo(gx + 24, gy - 48 - flap, gx, gy - 46);
    ctx.closePath();
    ctx.fillStyle = '#c0392b'; ctx.fill();
    ctx.strokeStyle = '#ffd479'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#ffe9a8'; ctx.font = 'bold 14px serif'; ctx.fillText('终', gx + 14, gy - 56);
  };

  UI.drawWorld = function (ctx, game) {
    const now = game.now;
    UI.drawPlatforms(ctx, game);
    UI.drawGoal(ctx, game);

    // 残影（在角色后面）
    if (game.fx) game.fx.draw(ctx, 'back');

    // 敌人
    for (const e of game.level.enemies) {
      if (!e.alive) continue;
      const k = (e.h / (ENEMY_ART_H[e.kind] || 34)) * 1.02;
      Art().drawEnemy(ctx, e, now, k);
      // 血条
      if (!e.isBoss) {
        const bw = Math.max(30, e.w);
        bar(ctx, e.x + (e.w - bw) / 2, e.y - 10, bw, 4.5, e.hp / e.maxHp, '#e74c3c');
      }
      if (e.stunUntil > now) {
        ctx.fillStyle = '#ffd479'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('★', e.x + e.w / 2, e.y - 16);
        ctx.textAlign = 'left';
      }
    }

    // 掷出的金箍棒：空中急旋 / 插地余波
    if (game.specials) {
      for (const s of game.specials) {
        if (!s || s.dead) continue;
        if (Art().drawSpinStaff) Art().drawSpinStaff(ctx, s, now);
      }
    }

    // 弹道（带光晕拖尾）
    for (const p of game.projectiles) {
      const g2 = ctx.createRadialGradient ? ctx.createRadialGradient(p.x, p.y, 1, p.x, p.y, p.r * 3.2) : null;
      if (g2 && g2.addColorStop) { g2.addColorStop(0, p.color); g2.addColorStop(1, 'rgba(0,0,0,0)'); ctx.globalAlpha = 0.55; ctx.fillStyle = g2; }
      else ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 3, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.55, 0, Math.PI * 2); ctx.fill();
    }

    // 玩家（2D 造型）
    const pl = game.player;
    const cloudOn = pl && now < (pl.cloudAuraUntil || 0);
    // 筋斗云的祥云：绕着角色转，后三片在身后
    if (cloudOn) {
      const fade = Math.min(1, (pl.cloudAuraUntil - now) / 240);
      const bx = pl.x + pl.w / 2, by = pl.y + pl.h * 0.58;
      for (let i = 0; i < 3; i++) {
        const ang = now / 175 + i * (Math.PI * 2 / 5);
        const rx = 30 + (i % 2) * 9;
        xiangyun(ctx, bx + Math.cos(ang) * rx, by + Math.sin(ang) * rx * 0.55,
          0.5 + 0.22 * (0.5 + 0.5 * Math.sin(ang)), 0.75 * fade);
      }
    }
    if (pl && pl.hp > 0) {
      const scale = XY.PLAYER_SCALE || 1.15;
      const pose = pl.pose(now);
      // 无敌闪烁
      if (pl.invuln > now && Math.floor(now / 90) % 2 === 0) ctx.globalAlpha = 0.45;
      // 护盾 / 加速光环
      if (now < pl.shieldUntil) {
        const prevA = ctx.globalAlpha;
        ctx.globalAlpha = prevA * 0.85;
        ctx.strokeStyle = 'rgba(255,212,121,0.9)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse ? ctx.ellipse(pl.x + pl.w / 2, pl.y + pl.h / 2, 32, 40, 0, 0, Math.PI * 2) : ctx.arc(pl.x + pl.w / 2, pl.y + pl.h / 2, 34, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = prevA;
      }
      Art().drawCharacter(ctx, pl.x + pl.w / 2, pl.y + pl.h + 2, scale, pl.char.id, pose);
      // 另外两片祥云转到身前，形成"云缠身"的包围感
      if (now < (pl.cloudAuraUntil || 0)) {
        const fade = Math.min(1, (pl.cloudAuraUntil - now) / 240);
        const bx = pl.x + pl.w / 2, by = pl.y + pl.h * 0.58;
        for (let i = 0; i < 2; i++) {
          const ang = now / 175 + 2.4 + i * (Math.PI * 2 / 5);
          const rx = 34 + i * 6;
          xiangyun(ctx, bx + Math.cos(ang) * rx, by + Math.sin(ang) * rx * 0.55, 0.62, 0.8 * fade);
        }
      }
      ctx.globalAlpha = 1;
      if (now < pl.buffSpdUntil) {
        ctx.fillStyle = 'rgba(127,208,255,0.85)';
        for (let i = 0; i < 3; i++) {
          const yy = pl.y + 14 + i * 16;
          ctx.fillRect(pl.x - 14 - i * 5, yy, 10, 2);
        }
      }
    }

    // 特效（刀光/火花/冲击环在前）
    if (game.fx) game.fx.draw(ctx, 'front');
  };

  // ===== HUD =====
  UI.drawPortrait = function (ctx, game) {
    const pl = game.player;
    const x = 14, y = 12, size = 84;
    // 外框
    ctx.save();
    rrect(ctx, x - 2, y - 2, size + 4, size + 4, 14);
    const g = ctx.createLinearGradient(x, y, x + size, y + size);
    g.addColorStop(0, '#f4c430'); g.addColorStop(0.5, '#8a6a22'); g.addColorStop(1, '#f4c430');
    ctx.fillStyle = g; ctx.fill();
    rrect(ctx, x, y, size, size, 12);
    const bg = ctx.createLinearGradient(x, y, x, y + size);
    bg.addColorStop(0, '#243046'); bg.addColorStop(1, '#101724');
    ctx.fillStyle = bg; ctx.fill();
    // 头像
    ctx.save();
    rrect(ctx, x, y, size, size, 12); ctx.clip();
    Art().drawFace(ctx, x + size / 2, y + 57, 23, pl.char.id, { t: game.now, mood: 'calm' });
    ctx.restore();
    // 等级徽标
    const bw = 34, bh = 18;
    rrect(ctx, x + size - bw + 4, y + size - bh + 4, bw, bh, 9);
    ctx.fillStyle = 'rgba(12,16,24,0.92)'; ctx.fill();
    ctx.strokeStyle = '#ffd479'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#ffd479'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Lv.' + pl.level, x + size - bw / 2 + 4, y + size - 1);
    ctx.textAlign = 'left';
    ctx.restore();
  };

  UI.drawHUD = function (ctx, game) {
    const pl = game.player;
    UI.drawPortrait(ctx, game);

    const bx = 108, bw = 252;
    // 名字 + 称号
    ctx.fillStyle = '#fff'; ctx.font = 'bold 17px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText(pl.char.name, bx, 30);
    const nameW = ctx.measureText(pl.char.name).width; // 必须在切换字号前量宽
    ctx.fillStyle = '#ffd479'; ctx.font = '12px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText('· ' + pl.char.title, bx + nameW + 10, 29);

    // 气血
    bar(ctx, bx, 38, bw, 16, pl.hp / pl.maxHp, '#e0453a', '#221a1f');
    ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.font = 'bold 11px sans-serif';
    ctx.fillText(Math.ceil(pl.hp) + ' / ' + pl.maxHp, bx + 8, 50);
    // 法力（气）
    bar(ctx, bx, 58, bw * 0.78, 11, pl.energy / pl.maxEnergy, '#3da5ff', '#141d2b');
    ctx.fillStyle = '#cfe8ff'; ctx.font = '10px sans-serif';
    ctx.fillText('气 ' + Math.ceil(pl.energy), bx + 6, 67);
    // 经验
    const need = XY.expToNext(pl.level);
    bar(ctx, bx, 75, bw * 0.78, 6, pl.exp / need, '#a06bff', '#1a1626');
    ctx.fillStyle = '#b9a2e8'; ctx.font = '10px sans-serif';
    ctx.fillText('EXP ' + Math.floor(pl.exp) + '/' + need, bx + bw * 0.78 + 8, 81);

    // 关卡名 + 进度
    ctx.textAlign = 'right';
    ctx.fillStyle = '#dfe7f2'; ctx.font = 'bold 14px "PingFang SC", sans-serif';
    ctx.fillText(game.level.name, W - 20, 30);
    const total = game.level.enemies.length;
    const killed = game.level.enemies.filter((e) => !e.alive).length;
    ctx.fillStyle = '#8a93a6'; ctx.font = '11px sans-serif';
    ctx.fillText(game.level.hasBoss ? '击败牛魔王即可通关' : '妖物 ' + killed + '/' + total + ' · 抵达终点旗帜通关', W - 20, 48);
    ctx.textAlign = 'left';

    // 货币：右上角常驻
    currencyChip(ctx, W - 248, 56, '仙玉', game.jade, '#7CFC9B');
    currencyChip(ctx, W - 128, 56, '金', game.gold, '#f4c430');

    // 状态图标（护盾/加速/攻击/防御）
    let bxx = 108;
    const now = game.now;
    const buffs = [];
    if (now < pl.buffAtkUntil) buffs.push(['攻', '#ffb35c']);
    if (now < pl.buffDefUntil) buffs.push(['防', '#8bc8ff']);
    if (now < pl.buffSpdUntil) buffs.push(['速', '#7fd0ff']);
    if (now < pl.shieldUntil) buffs.push(['盾', '#ffd479']);
    for (const b of buffs) {
      rrect(ctx, bxx, 88, 22, 16, 5);
      ctx.fillStyle = 'rgba(20,26,38,0.9)'; ctx.fill();
      ctx.strokeStyle = b[1]; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = b[1]; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(b[0], bxx + 11, 100); ctx.textAlign = 'left';
      bxx += 26;
    }

    // —— 技能图标 ——
    // 底部操作条压暗：避免怪物/地形从图标缝隙里透出来，保证可读性
    const scrimTop = H - 108;
    if (ctx.createLinearGradient) {
      const sg = ctx.createLinearGradient(0, scrimTop, 0, H);
      sg.addColorStop(0, 'rgba(6,9,14,0)');
      sg.addColorStop(0.6, 'rgba(6,9,14,0.55)');
      sg.addColorStop(1, 'rgba(6,9,14,0.82)');
      ctx.fillStyle = sg;
    } else {
      ctx.fillStyle = 'rgba(6,9,14,0.62)';
    }
    ctx.fillRect(0, scrimTop, W, H - scrimTop);

    const skillKeys = ['K', 'U', 'I'];
    for (let i = 0; i < 3; i++) {
      const sid = pl.char.skills[i];
      const sk = sid ? XY.getSkill(sid) : null;
      const x = 18 + i * 62, y = H - 82, size = 54;
      if (!sk) {
        rrect(ctx, x, y, size, size, size * 0.2);
        ctx.fillStyle = 'rgba(20,26,38,0.85)'; ctx.fill();
        ctx.strokeStyle = '#2a3550'; ctx.stroke();
        continue;
      }
      const cd = pl.skillCd[sk.id] || 0;
      const cdPct = now < cd ? (cd - now) / sk.cooldown : 0;
      const ready = pl.energy >= sk.cost && cdPct <= 0;
      Art().drawSkillIcon(ctx, x, y, size, sk, cdPct, ready);
      // 按键角标
      rrect(ctx, x + size - 16, y + size - 16, 16, 16, 4);
      ctx.fillStyle = 'rgba(8,11,17,0.9)'; ctx.fill();
      ctx.fillStyle = ready ? '#ffd479' : '#6c788c'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(skillKeys[i], x + size - 8, y + size - 4);
      ctx.textAlign = 'left';
      // 名称
      ctx.fillStyle = '#9fb0c8'; ctx.font = '10px "PingFang SC", sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(sk.name, x + size / 2, y - 6);
      ctx.textAlign = 'left';
    }

    // —— 法宝图标 ——
    for (let i = 0; i < 3; i++) {
      const tid = pl.treasures[i];
      const size = 54, x = W - 18 - size - (2 - i) * 62, y = H - 82;
      if (!tid) {
        rrect(ctx, x, y, size, size, size * 0.2);
        ctx.fillStyle = 'rgba(20,26,38,0.7)'; ctx.fill();
        ctx.strokeStyle = '#2a2a3a'; ctx.stroke();
        ctx.fillStyle = '#4b5468'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('空', x + size / 2, y + size / 2 + 4); ctx.textAlign = 'left';
        continue;
      }
      const t = XY.getTreasure(tid);
      const cd = pl.treasureCd[tid] || 0;
      const cdPct = now < cd ? (cd - now) / t.cooldown : 0;
      Art().drawTreasureIcon(ctx, x, y, size, t, cdPct, true);
      rrect(ctx, x + size - 16, y + size - 16, 16, 16, 4);
      ctx.fillStyle = 'rgba(8,11,17,0.9)'; ctx.fill();
      ctx.fillStyle = cdPct <= 0 ? '#d6b3ff' : '#6c788c'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(String(i + 1), x + size - 8, y + size - 4);
      ctx.textAlign = 'left';
      ctx.fillStyle = '#9a8fb8'; ctx.font = '10px "PingFang SC", sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(t.name, x + size / 2, y - 6);
      ctx.textAlign = 'left';
    }

    // —— 经验飘字（在 EXP 条附近） ——
    if (game.expPops) {
      for (const p of game.expPops) {
        const a = Math.max(0, Math.min(1, p.life / 0.5));
        ctx.globalAlpha = a;
        ctx.fillStyle = p.color || '#9be7ff';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText(p.text, bx + bw * 0.78 + 8, 96 - (1.1 - Math.min(1.1, p.life)) * 22);
        ctx.globalAlpha = 1;
      }
    }

    // 底部提示
    ctx.fillStyle = 'rgba(140,152,175,0.85)'; ctx.font = '11px "PingFang SC", sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('B 背包 · L 锻造 · G 商店 · H 技能 · P 暂停 · M 静音', W / 2, H - 6);
    ctx.textAlign = 'left';

    if (XY.Input && XY.Input.keyCount === 0) {
      ctx.fillStyle = 'rgba(255,212,121,0.92)'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('键盘未接管 · 用画面下方按钮操作（或先点一下画面再按键）', W / 2, 112);
      ctx.textAlign = 'left';
    }
  };

  // ===== 标题 =====

  // ===== 选角 =====
  // 卡片与"确认出战"按钮的几何：绘制和鼠标命中共用一份，改版面不会只改到一边
  UI.CHAR_L = { cardW: 168, gap: 14, y: 74, h: 384, btnW: 216, btnH: 34, btnY: 472 };
  UI.charSelectLayout = function () {
    const L = UI.CHAR_L;
    const n = XY.CHARACTER_ORDER.length;
    const total = n * L.cardW + (n - 1) * L.gap;
    return {
      n, cardW: L.cardW, gap: L.gap, y: L.y, h: L.h, x0: (W - total) / 2,
      btn: { x: (W - L.btnW) / 2, y: L.btnY, w: L.btnW, h: L.btnH },
    };
  };
  UI.charSelectCardAt = function (px, py) {
    const L = UI.charSelectLayout();
    if (!(py >= L.y && py <= L.y + L.h)) return -1;
    for (let i = 0; i < L.n; i++) {
      const x = L.x0 + i * (L.cardW + L.gap);
      if (px >= x && px <= x + L.cardW) return i;
    }
    return -1;
  };
  UI.charSelectBtnHit = function (px, py) {
    const b = UI.charSelectLayout().btn;
    return px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h;
  };

  UI.drawCharSelect = function (ctx, game) {
    UI.drawBackground(ctx, 0, game.uiTime);
    center(ctx, '选择你的角色', 50, 'bold 32px serif', '#ffd479');
    const order = XY.CHARACTER_ORDER;
    const L = UI.charSelectLayout();
    const { cardW, gap, y } = L;
    const x0 = L.x0;
    const mx = (XY.Input && XY.Input.mouse) ? XY.Input.mouse.x : -999;
    const my = (XY.Input && XY.Input.mouse) ? XY.Input.mouse.y : -999;
    const hover = UI.charSelectCardAt(mx, my);
    for (let i = 0; i < order.length; i++) {
      const c = XY.CHARACTERS[order[i]];
      const x = x0 + i * (cardW + gap);
      const sel = i === game.charIndex;
      const hov = i === hover && !sel;
      rrect(ctx, x, y, cardW, L.h, 12);
      ctx.fillStyle = sel ? 'rgba(42,53,80,0.96)' : (hov ? 'rgba(30,38,54,0.95)' : 'rgba(20,26,38,0.9)'); ctx.fill();
      ctx.strokeStyle = sel ? '#ffd479' : (hov ? '#7f8fb0' : '#33405c'); ctx.lineWidth = sel ? 3 : (hov ? 2 : 1); ctx.stroke();
      if (sel) {
        ctx.save();
        ctx.shadowColor = 'rgba(255,212,121,0.55)'; ctx.shadowBlur = 18;
        rrect(ctx, x, y, cardW, L.h, 12); ctx.stroke();
        ctx.restore();
      }
      // 立绘
      ctx.save();
      rrect(ctx, x + 6, y + 6, cardW - 12, 172, 8); ctx.clip();
