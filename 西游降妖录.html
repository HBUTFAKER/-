<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>西游·降妖录 — 横版动作闯关</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: #0b0e14;
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        color: #e6e6e6; overflow: hidden;
      }
      #app {
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; height: 100%; gap: 12px;
      }
      #game {
        display: block; background: #11151f; border: 1px solid #2a3142;
        border-radius: 8px; box-shadow: 0 12px 40px rgba(0,0,0,.5);
        image-rendering: pixelated; max-width: 100%; max-height: 82vh;
        outline: none;
      }
      .hint { font-size: 13px; color: #8a93a6; letter-spacing: .5px; }
      .hint b { color: #ffd479; }
      #pad {
        display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
        justify-content: center; max-width: 900px;
      }
      #pad[hidden] { display: none; }
      #pad button {
        min-width: 46px; height: 42px; padding: 0 10px; cursor: pointer;
        background: #1b2233; color: #e6e6e6; border: 1px solid #3a4a66;
        border-radius: 8px; font-size: 14px; font-family: inherit;
        user-select: none; touch-action: none;
      }
      #pad button.on { background: #2a3550; border-color: #ffd479; color: #ffd479; }
      #pad .sep { width: 10px; }
      #pad .tip { font-size: 12px; color: #8a93a6; margin-left: 6px; }
      #diag {
        display: none; position: fixed; left: 0; right: 0; bottom: 0; max-height: 42vh;
        overflow: auto; margin: 0; padding: 12px 16px; white-space: pre-wrap;
        background: rgba(120,10,10,.94); color: #ffe3e3; font-size: 12px;
        font-family: Consolas, monospace; z-index: 99;
      }
    </style>
    <!-- 启动诊断：脚本一出错就直接显示在页面底部，不再白屏 -->
    <script>
      window.__bootErrors = [];
      window.__diag = function (msg) {
        try {
          var el = document.getElementById('diag');
          window.__bootErrors.push(msg);
          if (el) { el.style.display = 'block'; el.textContent += msg + '\n'; }
          if (window.console) console.error(msg);
        } catch (e) { /* 忽略 */ }
      };
      window.addEventListener('error', function (e) {
        var where = (e.filename || '') + (e.lineno ? ':' + e.lineno : '');
        window.__diag('[脚本错误] ' + (e.message || e.error || '未知') + (where ? '\n  ' + where : ''));
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        window.__diag('[Promise 错误] ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
      });
    </script>
  </head>
  <body>
    <div id="app">
      <canvas id="game" width="960" height="540" tabindex="0"></canvas>
      <div class="hint">
        <b>A D</b> 移动（双击奔跑） · <b>W</b> 跳（空中可二段跳） · <b>S</b> 快落 · <b>J</b> 普攻 · <b>K U I</b> 技能 · <b>1 2 3</b> 法宝 · <b>B</b> 背包 · <b>L</b> 合成 · <b>P</b> 暂停
      </div>
      <!-- 键盘没接管时（预览面板/触屏）自动出现，用鼠标也能玩 -->
      <div id="pad" hidden>
        <button data-code="KeyA">A</button>
        <button data-code="KeyD">D</button>
        <button data-code="KeyW">W 跳</button>
        <button data-code="KeyS">S</button>
        <button data-code="KeyJ">普攻</button>
        <button data-code="KeyK">技1</button>
        <button data-code="KeyU">技2</button>
        <button data-code="KeyI">技3</button>
        <span class="sep"></span>
        <button data-code="Digit1">宝1</button>
        <button data-code="Digit2">宝2</button>
        <button data-code="Digit3">宝3</button>
        <span class="sep"></span>
        <button data-code="KeyB">背包</button>
        <button data-code="KeyL">合成</button>
        <button data-code="KeyQ">上一页</button>
        <button data-code="KeyE">下一页</button>
        <button data-code="Enter">确认</button>
        <button data-code="KeyP">暂停</button>
        <span class="tip">键盘未接管时用这些按钮</span>
      </div>
    </div>
    <pre id="diag"></pre>

// 纯逻辑层：随机数 / 战斗 / 掉落 / 合成。无 DOM 依赖，可被 Node 测试直接 require。
(function (root) {
  const XY = (root.XY = root.XY || {});

  // —— 可复现 RNG（mulberry32）——
  XY.mulberry32 = function (seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;

    const D = Number.isFinite(def) ? def : 0;
    const M = Number.isFinite(mul) && mul > 0 ? mul : 1;

      else bodyTilt = -0.1 + easeOut(seg(atk, 0.28, 0.68)) * 0.04;
    } else if (state === 'dash') bodyTilt = 0.17;
    else if (pose.castId === 'wk_smash') bodyTilt = -0.08;
    if (bodyTilt) ctx.rotate(bodyTilt);

    // —— 奔跑速度线（身后拖几道细线，强化"更快"的感觉）——
    if (sprint) {
      ctx.strokeStyle = 'rgba(255,247,220,0.28)';
      ctx.lineWidth = 1.6;
      ctx.lineCap = 'round';
      for (let i = 0; i < 3; i++) {
        const yy = -46 + i * 15;
        const len = 20 + ((t / 3 + i * 17) % 16);
        ctx.beginPath();
        ctx.moveTo(-16 - len * 0.4, yy);
        ctx.lineTo(-16 - len, yy + 1.5);
        ctx.stroke();
      }
    }

    // —— 披风（身后，随风摆动） ——
    if (A.cape) {
      const flap = Math.sin(t / 120) * 4 + (run ? 7 : 0) + (air ? 10 : 0);
      ctx.beginPath();
      ctx.moveTo(-2, -48);
      ctx.quadraticCurveTo(-22 - flap * 0.6, -34, -26 - flap, -2);
      ctx.quadraticCurveTo(-14 - flap * 0.3, -12, -6, -20);
      ctx.closePath();
      ctx.fillStyle = A.cape; ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.32)'; ctx.lineWidth = 1.2; ctx.stroke();
      // 内层高光，避免死板色块
      ctx.beginPath();
      ctx.moveTo(-3, -45);
      ctx.quadraticCurveTo(-16 - flap * 0.4, -32, -19 - flap * 0.7, -8);
      ctx.quadraticCurveTo(-11, -16, -6, -22);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,255,255,0.16)'; ctx.fill();
    }

    // —— 后腿 ——
    drawLeg(ctx, -3.5, legB, A);
    // —— 后臂 ——
    drawArm(ctx, -4.5, -42, armBase + 0.3, A, 15);

    // —— 脖子 ——
    rr(ctx, -3.2, -52, 6.4, 8, 2.6); shape(ctx, A.skin, 1.1);

    // —— 身体 ——
    ctx.save();
    // 腰/裙甲
    ctx.fillStyle = A.armorDark;
    rr(ctx, -9.5, -27, 19, 12, 5); shape(ctx, A.armorDark, 1.3);
    // 胸甲
    rr(ctx, -10.5, -47, 21, 22, 7); shape(ctx, A.armor, 1.5);
    // 胸口纹样
    ctx.beginPath();
    ctx.moveTo(-5, -42); ctx.quadraticCurveTo(0, -36, 5, -42);
    ctx.strokeStyle = A.trim; ctx.lineWidth = 2; ctx.stroke();
    if (A.helmet) {
      // 护心镜：金甲正中的圆镜，一并压出"重甲"感
      circle(ctx, 0, -39, 5.4); shape(ctx, A.mirror, 1.4);
      circle(ctx, 0, -39, 2.6); ctx.fillStyle = 'rgba(184,134,11,0.5)'; ctx.fill();
      circle(ctx, -1.3, -40.4, 1.5); ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fill();
      // 披膊：肩下两层甲片
      for (const sx of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(sx * 4.6, -46);
        ctx.lineTo(sx * 10.6, -44);
        ctx.lineTo(sx * 9.6, -34);
        ctx.lineTo(sx * 5.2, -36);
        ctx.closePath();
        shape(ctx, A.armorDark, 1.1);
      }
    }
    if (A.belly) { // 八戒的肚子
      ctx.beginPath();
      if (ctx.ellipse) ctx.ellipse(6, -28, 7, 6, 0, 0, Math.PI * 2);
      else ctx.arc(6, -28, 6, 0, Math.PI * 2);
      shape(ctx, '#e6c6a4', 1.2);
    }
    // 腰带
    rr(ctx, -9.5, -27.5, 19, 4, 2); shape(ctx, A.trim, 1);
    // 缠颈红巾
    if (A.cape) {
      rr(ctx, -6.4, -50.5, 12.8, 5, 2.4); shape(ctx, A.cape, 1.2);
      ctx.beginPath();
      ctx.moveTo(4, -47); ctx.lineTo(9, -44); ctx.lineTo(6, -40);
      ctx.closePath(); shape(ctx, A.cape, 1);
    }
    ctx.restore();

    // —— 前腿 ——
    drawLeg(ctx, 4, legA, A);

    // —— 战裙（三片甲，压在腿上）——
    if (A.helmet) {
      for (let i = -1; i <= 1; i++) {
        const bx = i * 5.9;
        ctx.beginPath();
        ctx.moveTo(bx - 3, -24.6);
        ctx.lineTo(bx + 3, -24.6);
        ctx.lineTo(bx + 3.8, -15.2);
        ctx.lineTo(bx - 3.8, -15.2);
        ctx.closePath();
        shape(ctx, i === 0 ? A.armor : A.armorDark, 1.1);
        // 甲片下缘金边
        line(ctx, bx - 3.4, -16.2, bx + 3.4, -16.2, 1.2, A.trim);
      }
    }

    // —— 头 ——
    Art.drawFace(ctx, 1, -56, 10, charId, { t: t, mood: state === 'attack' ? 'angry' : 'calm', wind: windAmt });

    // —— 前臂 + 武器 ——
    // 手臂与兵器分开驱动：arm 控手臂，wpn 是兵器的绝对角 → 兵器始终握在手里、不穿身。
    const SHX = 6, SHY = -41, ARM = 14;   // 肩点、手臂长度（角色坐标）
    let armAng, wpnAng, offX = 0, offY = 0, wpnShift = 0;
    if (atk !== undefined) {
      const sp = swingProfile(pose.attackKind || 0, atk);
      armAng = sp.arm; wpnAng = sp.wpn; offX = sp.x; offY = sp.y; wpnShift = sp.g || 0;
    } else if (pose.castId === 'wk_smash') {
      const q = cast === undefined ? 0 : cast;
      armAng = -2.0 + q * 0.2; wpnAng = -0.5 + q * 0.14;      // 举棒过顶，蓄力
    } else if (pose.castId === 'wk_spin') {
      armAng = -0.95 + (cast === undefined ? 0 : cast) * 0.9; // 抖腕掷出
      wpnAng = 0.55;
    } else if (state === 'dash') {
      armAng = 1.0; wpnAng = -0.46;                            // 棒背身后
    } else if (cast !== undefined) {
      armAng = -0.62; wpnAng = -0.5;                           // 其余施法：抬臂
    } else {
      // 站立：棒子略微前倾、握在身侧，别挡住脸
      armAng = armBase * 0.5 - 0.34; wpnAng = 0.14 + armBase * 0.12;
    }

    // 兵器残影：沿同一条挥动曲线回退几帧 → 棒影连成一片，动作与兵器是一体的
    if (atk !== undefined) {
      for (let g = 8; g >= 1; g--) {
        const gp = atk - g * 0.032;
        if (gp < 0) break;
        const sp = swingProfile(pose.attackKind || 0, gp);
        const ghx = SHX - Math.sin(sp.arm) * ARM + sp.x;
        const ghy = SHY + Math.cos(sp.arm) * ARM + sp.y;
        ctx.save();
        ctx.translate(ghx + 1.2, ghy);
        ctx.rotate(sp.wpn);
        ctx.translate(0, sp.g || 0);
        ctx.globalAlpha = 0.05 + 0.012 * (8 - g);
        drawWeapon(ctx, A);
        ctx.restore();
      }
    }

    // 握点：肩点 + 手臂旋转（+ 招式带来的前送/下沉）。兵器在角色坐标系里按绝对角摆放，
    // 所以无论手臂怎么甩，棒子始终落在手里。
    const handX = SHX - Math.sin(armAng) * ARM + offX;
    const handY = SHY + Math.cos(armAng) * ARM + offY;
    ctx.save();
    ctx.translate(SHX, SHY);
    ctx.rotate(armAng);
    drawArm(ctx, 0, 0, 0, A, ARM);
    ctx.restore();
    if (!pose.noWeapon) {
      ctx.save();
      ctx.translate(handX + 1.2, handY);
      ctx.rotate(wpnAng);
      if (wpnShift) ctx.translate(0, wpnShift);
      drawWeapon(ctx, A);
      ctx.restore();
      // 手（画在兵器之后，形成"握住"的遮挡关系）
      circle(ctx, handX + 1.2, handY, 3.6); shape(ctx, A.skin, 1.1);
      circle(ctx, handX + 1.2, handY, 1.6); ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fill();
    }

    // —— 护肩（贴在前臂根部，做出重甲感）——
    ctx.beginPath();
    if (ctx.ellipse) ctx.ellipse(7.2, -45.2, 5.6, 4.2, -0.3, 0, Math.PI * 2);
    else ctx.arc(7.2, -45.2, 4.8, 0, Math.PI * 2);
    shape(ctx, A.armorDark, 1.3);
    ctx.beginPath();
    if (ctx.ellipse) ctx.ellipse(7.4, -46.2, 3.4, 1.8, -0.3, 0, Math.PI * 2);
    else ctx.arc(7.4, -46.2, 2.4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.fill();

    ctx.restore();
  };

  function drawLeg(ctx, hx, ang, A) {
    ctx.save();
    ctx.translate(hx, -23);
    ctx.rotate(ang);
    rr(ctx, -4.2, 0, 8.4, 19, 4); shape(ctx, A.armorDark, 1.3);
    // 靴
    rr(ctx, -4.8, 15, 10, 6.5, 2.5); shape(ctx, '#3a2a1c', 1.2);
    ctx.restore();
  }
  function drawArm(ctx, sx, sy, ang, A, len) {
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(ang);
    rr(ctx, -3.2, 0, 6.4, len, 3.2); shape(ctx, A.armor, 1.2);
    if (A.helmet) { // 护腕（金箍环）
      rr(ctx, -3.7, len * 0.4, 7.4, 5.4, 2.2); shape(ctx, A.armorDark, 1);
      line(ctx, -3.1, len * 0.43, 3.1, len * 0.43, 1, A.trim);
    }
    circle(ctx, 0, len, 3.2); shape(ctx, A.skin, 1.1);
    ctx.restore();
  }

  // —— 三段普攻的兵器轨迹 ——
  // 返回：手臂角 arm、兵器绝对角 wpn、握点偏移 x/y。p 为动作进度 0..1。
  function seg(p, a, b) { return Math.min(1, Math.max(0, (p - a) / (b - a))); }
  function easeOut(p) { return 1 - (1 - p) * (1 - p); }
  function swingProfile(kind, p) {
    if (kind === 1) {              // 戳：收棒蓄力 → 直刺 → 回收
      const back = easeOut(seg(p, 0, 0.3));
      const out = easeOut(seg(p, 0.3, 0.54));
      const ret = seg(p, 0.66, 1);
      return {
        arm: 0.12 + back * 0.62 - out * 0.66 - ret * 0.08,
        wpn: -0.16 + back * 1.5 + out * 0.04 - ret * 1.4,
        x: -back * 8 + out * 26 - ret * 18,
        y: -7 - back * 3,
        g: 11,                     // 握点前移：棒尾不穿身，刺出去的是前半截
      };
    }
    if (kind === 2) {              // 挑：棒梢沉到身前 → 一路撩起
      const low = easeOut(seg(p, 0, 0.3));
      const up = easeOut(seg(p, 0.3, 0.68));
      const ret = seg(p, 0.68, 1);
      return {
        arm: -0.08 + low * 0.72 - up * 1.5 + ret * 0.12,
        wpn: -0.12 + low * 2.55 - up * 2.15 + ret * 0.3,
        x: -low * 2 + up * 4,
        y: low * 3 - up * 6 + ret * 2,
      };
    }
    // 劈：举棒过顶 → 砸向前下（第三段之外，普攻首段也是这个）
    const rai = easeOut(seg(p, 0, 0.34));
    const down = easeOut(seg(p, 0.34, 0.8));
    const ret = seg(p, 0.8, 1);
    return {
      arm: -0.3 - rai * 0.92 + down * 1.5 - ret * 0.18,
      wpn: -0.18 - rai * 0.95 + down * 3.28 - ret * 0.28,
      x: down * 4,
      y: -rai * 2 + down * 3,
      g: -down * 6,               // 劈到末端时握把往后收，棒身更多压向前方
    };
  }
  Art.swingProfile = swingProfile;
  function drawWeapon(ctx, A) {
    switch (A.weapon) {
      case 'staff': { // 金箍棒（红杆金箍）
        rr(ctx, -2.3, -46, 4.6, 66, 2.2); shape(ctx, '#c0392b', 1.5);
        rr(ctx, -3.2, -51, 6.4, 9, 2.4); shape(ctx, '#f4c430', 1.2);
        rr(ctx, -3.2, 13, 6.4, 9, 2.4); shape(ctx, '#f4c430', 1.2);
        line(ctx, -1.1, -40, -1.1, 12, 1.2, 'rgba(255,255,255,0.35)');
        break;
      }
      case 'rake': { // 九齿钉耙
        rr(ctx, -2, -34, 4, 50, 2); shape(ctx, '#6d5138', 1.3);
        rr(ctx, -9, -41, 18, 7, 3); shape(ctx, '#b9c0c6', 1.3);
        for (let i = -1; i <= 1; i++) { rr(ctx, i * 6 - 1.2, -35, 2.4, 7, 1); shape(ctx, '#d7dde2', 0.8); }
        break;
      }
      case 'staff2': { // 降妖宝杖
        rr(ctx, -2, -44, 4, 62, 2); shape(ctx, '#8c7a5c', 1.3);
        circle(ctx, 0, -44, 4.4); shape(ctx, '#c8d0d1', 1.2);
        circle(ctx, 0, 16, 3.6); shape(ctx, '#c8d0d1', 1.1);
        break;
      }
      case 'spear': { // 龙枪
        rr(ctx, -1.8, -36, 3.6, 50, 2); shape(ctx, '#2e86c1', 1.2);
        ctx.beginPath();
        ctx.moveTo(0, -54); ctx.lineTo(5, -36); ctx.lineTo(0, -30); ctx.lineTo(-5, -36);
        ctx.closePath(); shape(ctx, '#eaf6ff', 1.2);
        break;
      }
      default: break;
    }
  }

  // 掷出去的金箍棒：空中急旋 / 插进大地（供 UI 层绘制）
  Art.drawSpinStaff = function (ctx, s, now) {
    const fade = (typeof s.fade === 'number' && isFinite(s.fade)) ? Math.max(0, Math.min(1, s.fade)) : 1;
    if (fade <= 0.01) return;
    ctx.save();
    ctx.translate(s.x, s.y);
    if (s.state === 'stuck') {
      const age = Math.max(0, (now - (s.landAt || now)) / 1000);
      const a = fade * (age > 0.8 ? Math.max(0, 1 - (age - 0.8) / 0.3) : 1);
      if (a <= 0.01) { ctx.restore(); return; }
      // 砸出来的坑 + 几块碎石（不做放射状裂纹，免得读成"钟面"）
      ctx.fillStyle = 'rgba(0,0,0,0.38)';
      ctx.beginPath();
      if (ctx.ellipse) ctx.ellipse(0, 1, 36, 9, 0, 0, Math.PI * 2);
      else ctx.arc(0, 1, 28, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(150,112,72,0.95)';
      for (let i = 0; i < 4; i++) {
        const rx = (i % 2 ? 1 : -1) * (22 + i * 7);
        ctx.fillRect(rx, -4 - (i % 3) * 3, 6, 4);
      }
      ctx.rotate(-0.06 + Math.sin(age * 26) * 0.035 * Math.max(0, 1 - age * 1.6));
      ctx.globalAlpha = a;
      ctx.scale(1.9, 1.9);
      drawWeapon(ctx, ART.wukong);
      ctx.restore();
      return;
    }
    // 飞行：棒身自旋 + 两道旋转金弧
    ctx.globalAlpha = fade;
    ctx.save();
    ctx.rotate(-s.spin * 0.45);
    ctx.strokeStyle = 'rgba(255,246,214,0.3)';
    ctx.lineWidth = 9;
    ctx.beginPath(); ctx.arc(0, 0, 42, 0.5, 2.2); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,214,120,0.55)';
    ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(0, 0, 42, 0.35, 2.5); ctx.stroke();
    ctx.restore();
    ctx.rotate(s.spin);
    ctx.scale(1.75, 1.75);
    drawWeapon(ctx, ART.wukong);
    ctx.restore();
  };

  // ===== 怪物 =====
  // scale：按碰撞盒高度自动缩放（Boss 的碰撞盒比小怪大得多）
  Art.drawEnemy = function (ctx, e, t, scale) {
    const flash = e.hitFlash > 0;
    const k = scale || 1;
    // 出手前冲：让"打人"有动作，而不是站着贴图
    const atkLeft = (e.atkUntil || 0) - t;
    const lunge = atkLeft > 0 ? Math.sin(Math.min(1, atkLeft / 260) * Math.PI) * 7 : 0;
    ctx.save();
    ctx.translate(e.x + e.w / 2, e.y + e.h);
    const sx = (e.facing || -1) < 0 ? -1 : 1;
    ctx.scale(sx * k, k);
    ctx.translate(lunge, 0);
    const body = flash ? '#ffffff' : null;

    if (e.kind === 'wolf') {
      rr(ctx, -18, -26, 34, 20, 8); shape(ctx, body || '#6b4a2b', 1.4);
      // 头
      ctx.beginPath();
      ctx.moveTo(10, -28); ctx.lineTo(24, -34); ctx.lineTo(22, -20); ctx.closePath();
      shape(ctx, body || '#7d5632', 1.3);
      // 腿
      ctx.strokeStyle = body || '#4a3220'; ctx.lineWidth = 2.6;
      for (let i = -1; i <= 1; i += 2) {
        const ph = Math.sin(t / 110 + i) * 2.5;
        line(ctx, i * 10, -8, i * 10 + ph, 0, 2.6, body || '#4a3220');
      }
      circle(ctx, 18, -30, 1.6); ctx.fillStyle = '#ff5e5e'; ctx.fill();
    } else if (e.kind === 'spider') {
      ctx.fillStyle = body || '#5a2b6b';
      ctx.beginPath();
      if (ctx.ellipse) ctx.ellipse(0, -16, 16, 13, 0, 0, Math.PI * 2);
      else ctx.arc(0, -16, 13, 0, Math.PI * 2);
      shape(ctx, body || '#5a2b6b', 1.4);
      ctx.strokeStyle = body || '#3d1c49'; ctx.lineWidth = 2;
      for (let i = 0; i < 4; i++) {
        const leg = -12 + i * 8, ph = Math.sin(t / 90 + i) * 2;
        line(ctx, leg, -14, leg - 4, -2 + ph, 2, body || '#3d1c49');
        line(ctx, leg, -14, leg + 6, -2 - ph, 2, body || '#3d1c49');
      }
      for (const ex of [-6, -2, 2, 6]) { circle(ctx, ex, -20, 1.5); ctx.fillStyle = '#ff6b6b'; ctx.fill(); }
    } else if (e.kind === 'boss') {
      // 牛魔王
      ctx.fillStyle = body || '#8e2b2b';
      rr(ctx, -22, -76, 44, 62, 12); shape(ctx, body || '#8e2b2b', 1.8);
      // 牛角
      ctx.strokeStyle = body || '#e8dcc8'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(s * 14, -74);
        ctx.quadraticCurveTo(s * 34, -86, s * 30, -66);
        ctx.stroke();
      }
      // 眼睛
      for (const s of [-1, 1]) { circle(ctx, s * 9, -58, 3.4); ctx.fillStyle = '#ffd479'; ctx.fill(); }
      // 鼻环
      ctx.strokeStyle = '#ffd479'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, -44, 6, 0, Math.PI); ctx.stroke();
      // 斧
      ctx.save(); ctx.translate(26, -50); ctx.rotate(Math.sin(t / 400) * 0.1);
      rr(ctx, -2, -26, 4, 50, 2); shape(ctx, '#5b4a32', 1.2);
      ctx.beginPath();
      ctx.moveTo(0, -30); ctx.quadraticCurveTo(18, -24, 14, -6); ctx.lineTo(0, -10);
      ctx.closePath(); shape(ctx, '#c9cfd6', 1.4);
      ctx.restore();
    } else { // imp 小妖：短腿 + 圆身 + 角 + 獠牙，比纯色块好辨认
      const dark = body || '#8e2f26';
      // 腿
      line(ctx, -6, -8, -8, 0, 3.2, dark);
      line(ctx, 6, -8, 8, 0, 3.2, dark);
      // 手臂
      line(ctx, -11, -18, -17, -10, 3, dark);
      line(ctx, 11, -18, 17, -10, 3, dark);
      // 身子
      ctx.beginPath();
      if (ctx.ellipse) ctx.ellipse(0, -18, 13, 14, 0, 0, Math.PI * 2);
      else ctx.arc(0, -18, 13, 0, Math.PI * 2);
      shape(ctx, body || '#b5483b', 1.5);
      // 肚皮
      ctx.beginPath();
      if (ctx.ellipse) ctx.ellipse(1, -15, 7, 8, 0, 0, Math.PI * 2);
      else ctx.arc(1, -15, 7, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,220,190,0.35)'; ctx.fill();
      // 角
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(s * 6, -29); ctx.quadraticCurveTo(s * 11, -37, s * 4, -39);
        ctx.lineTo(s * 2.5, -30); ctx.closePath();
        shape(ctx, body || '#f0e0c0', 1.2);
      }
      // 眼
      for (const s of [-1, 1]) { circle(ctx, s * 4.5, -21, 2.4); ctx.fillStyle = '#2b1210'; ctx.fill(); }
      // 獠牙
      ctx.fillStyle = '#fff8e6';
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.moveTo(s * 3, -14); ctx.lineTo(s * 5, -11); ctx.lineTo(s * 1.5, -12); ctx.closePath(); ctx.fill();
      }
    }
    ctx.restore();
  };

  // ===== 技能图标 =====
  // kind: melee/dash/aoe/ranged/heal/buff，按类型给不同图形
  Art.drawSkillIcon = function (ctx, x, y, size, skill, cdPct, ready) {
    const col = skillColor(skill);
    ctx.save();
    // 底
    rr(ctx, x, y, size, size, size * 0.2);
    ctx.fillStyle = '#141a26'; ctx.fill();
    ctx.strokeStyle = ready ? col : '#3a4a66'; ctx.lineWidth = 2; ctx.stroke();
    // 图形
    const cx = x + size / 2, cy = y + size / 2, r = size * 0.3;
    ctx.save();
    ctx.translate(cx, cy);

    <script>
/* ===== fx.js ===== */
// 特效层：刀光 / 火花 / 冲击环 / 冲刺残影 / 升级光柱 / 治疗光尘。
// 只负责"看得爽"，不参与任何战斗判定，可随时清空。
(function (root) {
  const XY = (root.XY = root.XY || {});
  const FX = (XY.FX = {});
  const MAX = 340;

  function seg(p, a, b) { return Math.min(1, Math.max(0, (p - a) / (b - a))); }

  // 十丈金箍棒：一根被放大到离谱的棒子，从头顶抡下来砸地
  function drawGiantStaff(ctx, L, Wd) {
    // 棒身
    ctx.beginPath();

    ctx.rect(-Wd / 2 + Wd * 0.14, -L, Wd * 0.16, L);
    ctx.fillStyle = 'rgba(255,236,190,0.22)'; ctx.fill();

    for (const yy of [-L - Wd * 1.1, -Wd * 1.2]) {
      ctx.beginPath();
      ctx.rect(-Wd * 0.74, yy, Wd * 1.48, Wd * 1.4);
      ctx.fillStyle = '#f4c430'; ctx.fill();
      ctx.strokeStyle = '#2a1208'; ctx.lineWidth = 3; ctx.stroke();
      ctx.beginPath();
      ctx.rect(-Wd * 0.74 + 3, yy + 4, Wd * 0.3, Wd * 1.4 - 8);
      ctx.fillStyle = 'rgba(255,255,255,0.42)'; ctx.fill();
    }
  }

  XY.FXLayer = class {
    constructor() {
      this.items = [];
      this.t = 0;
    }
    clear() { this.items.length = 0; }
    _push(it) {
      if (this.items.length >= MAX) this.items.shift();
      this.items.push(it);
    }

    update(dt) {
      this.t += dt * 1000;
      const out = [];
      for (let i = 0; i < this.items.length; i++) {
        const it = this.items[i];
        it.life -= dt;
        if (it.life <= 0) continue;
        if (it.type === 'spark' || it.type === 'trail') {
          it.x += it.vx * dt;
          it.y += it.vy * dt;
          it.vy += (it.gravity === undefined ? 780 : it.gravity) * dt;
          it.vx *= 0.985;
        } else if (it.type === 'ghost') {
          it.x += (it.drift || 0) * dt;
        } else if (it.type === 'cloud') {
          it.x += it.vx * dt;
          it.y += it.vy * dt;

    slashStyle(x, y, dir, color, scale, life, style) {

  function heavenRuins(ctx, cx, baseY, t) {
    const INK = '#17293a';
    ctx.save();
    ctx.translate(cx, baseY);

    // 悬浮碎块（在台基后方远处）
    const frags = [[-286, -76, 14], [268, -104, 11], [-176, -152, 9], [300, 6, 9], [-320, -18, 8], [150, -186, 8]];
    for (let i = 0; i < frags.length; i++) {
      const f = frags[i];
      const fy = f[1] + Math.sin(t / 1100 + i * 1.7) * 6;
      ctx.save();
      ctx.translate(f[0], fy);
      ctx.rotate(Math.sin(t / 1700 + i) * 0.28);
      ctx.fillStyle = '#1b3042';
      ctx.beginPath();
      ctx.moveTo(-f[2], -f[2] * 0.4);
      ctx.lineTo(f[2] * 0.5, -f[2]);
      ctx.lineTo(f[2], f[2] * 0.4);
      ctx.lineTo(-f[2] * 0.4, f[2] * 0.9);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // 参差的碎裂台基
    ctx.beginPath();
    ctx.moveTo(-224, 2);
    ctx.lineTo(-160, -5);
    ctx.lineTo(-66, 0);
    ctx.lineTo(32, -7);
    ctx.lineTo(134, -1);
    ctx.lineTo(226, 5);
    ctx.lineTo(206, 24);
    ctx.lineTo(158, 37);
    ctx.lineTo(108, 28);
    ctx.lineTo(58, 49);
    ctx.lineTo(12, 31);
    ctx.lineTo(-40, 41);
    ctx.lineTo(-94, 25);
    ctx.lineTo(-150, 34);
    ctx.lineTo(-206, 19);
    ctx.closePath();
    ctx.fillStyle = INK;
    ctx.fill();
    // 台面逆光边
    ctx.strokeStyle = 'rgba(255,214,150,0.38)';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(-224, 2); ctx.lineTo(-160, -5); ctx.lineTo(-66, 0);
    ctx.lineTo(32, -7); ctx.lineTo(134, -1); ctx.lineTo(226, 5);
    ctx.stroke();
    // 台面砖缝
    ctx.strokeStyle = 'rgba(120,152,172,0.2)';
    ctx.lineWidth = 1;
    for (let i = -5; i <= 5; i++) {
      ctx.beginPath(); ctx.moveTo(i * 40, -1); ctx.lineTo(i * 36, 22); ctx.stroke();
    }

    // 建筑：配殿 / 主殿 / 残殿
    hall(ctx, -128, -1, 96, 64, false, -0.02);
    hall(ctx, 14, -2, 140, 92, true, 0.012);
    hall(ctx, 168, -1, 86, 52, true, 0.06);

    // 南天门脚下的独立浮岩
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.moveTo(-346, 4); ctx.lineTo(-330, -6); ctx.lineTo(-232, -2);
    ctx.lineTo(-226, 14); ctx.lineTo(-268, 32); ctx.lineTo(-320, 24);
    ctx.closePath(); ctx.fill();

    // 南天门（更夸张的倾斜）
    southGate(ctx, -286, -2, -0.12);

    // 向外悬伸的断桥
    ctx.save();
    ctx.translate(232, -2);
    ctx.rotate(-0.16);
    ctx.fillStyle = INK;
    ctx.fillRect(0, 0, 92, 8);
    ctx.fillRect(8, 8, 7, 18);
    ctx.fillRect(40, 8, 7, 26);
    ctx.fillRect(74, 8, 7, 15);
    ctx.fillStyle = 'rgba(255,214,150,0.3)';
    ctx.fillRect(0, 0, 92, 2);
    ctx.restore();

    // 悬空断阶（从台基左侧向下延伸，像被炸断的天梯）
    ctx.fillStyle = '#1a2f40';
    for (let i = 0; i < 3; i++) {
      ctx.save();
      ctx.translate(-250 - i * 34, 22 + i * 30);
      ctx.rotate(-0.24 + i * 0.1);
      ctx.fillRect(0, 0, 46, 7);
      ctx.restore();
    }
    ctx.restore();
  }

  // 瀑布（水带 + 流动高光 + 潭底水雾）
  function waterfall(ctx, x, yTop, yBot, w, t) {
    ctx.fillStyle = 'rgba(216,238,248,0.22)';
    ctx.beginPath();
    ctx.moveTo(x - w * 0.42, yTop);
    ctx.quadraticCurveTo(x - w * 0.56, (yTop + yBot) * 0.5, x - w * 0.88, yBot);
    ctx.lineTo(x + w * 0.88, yBot);
    ctx.quadraticCurveTo(x + w * 0.56, (yTop + yBot) * 0.5, x + w * 0.42, yTop);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 1.6;
    for (let i = 0; i < 5; i++) {
      const p = (t / 1100 + i * 0.21) % 1;
      const yy = yTop + (yBot - yTop) * p;
      const xx = x + (i - 2) * w * 0.28 + Math.sin(t / 520 + i) * 2;
      ctx.beginPath(); ctx.moveTo(xx, yy); ctx.lineTo(xx, yy + 15); ctx.stroke();
    }
    softBlob(ctx, x, yBot + 4, w * 1.6, null, [[0, 'rgba(226,244,250,0.34)'], [1, 'rgba(226,244,250,0)']]);
  }

  // 桃树剪影
  function peachTree(ctx, x, y, sc, color) {
    ctx.save();

    ctx.lineTo(-4, -38);
    ctx.quadraticCurveTo(2, -22, 6, 0);
    ctx.closePath();
    ctx.fill();
    // 枝
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(-6, -32); ctx.lineTo(-24, -46); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -34); ctx.lineTo(20, -50); ctx.stroke();
    const blobs = [[-30, -52, 15], [-12, -62, 19], [10, -60, 17], [28, -52, 14], [0, -44, 15]];
    for (let i = 0; i < blobs.length; i++) ell(ctx, blobs[i][0], blobs[i][1], blobs[i][2], blobs[i][2] * 0.86);
    ctx.restore();
  }

  // ========== 场景一：花果山 · 云上天宫废墟 ==========
  function sceneMountain(ctx, t, camX) {
    ctx.fillStyle = grad(ctx, 0, H, [

      [0, 'rgba(255,232,176,0.55)'], [0.22, 'rgba(255,206,140,0.28)'],

    // 远山（雾中两层，刻意压低对比度）

    const wx = 268 - camX * 0.36;

    ctx.beginPath();

    ctx.lineTo(wx - 92, 470);
    ctx.lineTo(wx - 54, 412);
    ctx.lineTo(wx - 16, 396);
    ctx.lineTo(wx + 26, 414);
    ctx.lineTo(wx + 56, 470);
    ctx.lineTo(wx + 74, 540);

    // 近景桃树
    peachTree(ctx, 74 - camX * 0.52, 524, 1.3, '#0d1e26');
    peachTree(ctx, 906 - camX * 0.52, 526, 1.1, '#0f2230');

    // 花瓣

      const px = ((i * 137 + t * 14) % (W + 80)) - 40;
      const py = ((i * 103 + t * 30) % (H + 60)) - 30;
      ctx.fillStyle = 'rgba(255,206,222,0.42)';
      ctx.beginPath(); ctx.arc(px, py, 2.1, 0, Math.PI * 2); ctx.fill();

  // ========== 场景二：黑风洞 ==========
  function sceneCave(ctx, t, camX) {
    ctx.fillStyle = grad(ctx, 0, H, [[0, '#1c132c'], [0.42, '#140e22'], [1, '#06040a']]);
    ctx.fillRect(0, 0, W, H);

    // 深处的洞府石门（黑熊精老巢）：两侧石柱 + 门楣 + 拱形门洞
    const gx = 690 - camX * 0.1, gy = 318;
    softBlob(ctx, gx, gy - 70, 380, null, [
      [0, 'rgba(120,214,172,0.22)'], [0.42, 'rgba(56,132,116,0.12)'], [1, 'rgba(0,0,0,0)'],
    ]);

    ctx.fillStyle = '#191228';
    ctx.fillRect(gx - 140, gy - 186, 42, 186);
    ctx.fillRect(gx + 98, gy - 186, 42, 186);
    ctx.fillRect(gx - 162, gy - 210, 324, 32);
    // 石柱逆光边（幽绿冷光）
    ctx.fillStyle = 'rgba(120,214,178,0.22)';
    ctx.fillRect(gx - 140, gy - 186, 3, 186);
    ctx.fillRect(gx + 137, gy - 186, 3, 186);
    ctx.fillRect(gx - 162, gy - 210, 324, 3);
    // 柱身砖缝

      ctx.beginPath(); ctx.moveTo(gx + 98, yy); ctx.lineTo(gx + 140, yy); ctx.stroke();
    }
    // 门洞
    ctx.fillStyle = '#05030a';
    ctx.beginPath();
    ctx.moveTo(gx - 96, gy);
    ctx.lineTo(gx - 96, gy - 128);
    ctx.quadraticCurveTo(gx, gy - 192, gx + 96, gy - 128);
    ctx.lineTo(gx + 96, gy);
    ctx.closePath();
    ctx.fill();
    // 门内幽光
    const dg = radial(ctx, gx, gy - 44, 136, [
      [0, 'rgba(120,220,180,0.16)'], [0.5, 'rgba(60,150,124,0.08)'], [1, 'rgba(0,0,0,0)'],
    ]);
    if (dg) { ctx.fillStyle = dg; ctx.fillRect(gx - 136, gy - 180, 272, 200); }
    // 门楣牌匾
    ctx.fillStyle = '#161026';
    ctx.fillRect(gx - 46, gy - 204, 92, 26);
    ctx.strokeStyle = 'rgba(126,214,178,0.34)';
    ctx.lineWidth = 1.6;
    ctx.strokeRect(gx - 46, gy - 204, 92, 26);
    ctx.fillStyle = 'rgba(126,214,178,0.42)';
    for (let i = 0; i < 2; i++) ctx.fillRect(gx - 24 + i * 32, gy - 198, 17, 13);

    // 风眼旋涡（黑色风带 + 几点碎光，读起来像"卷"的东西）
    ctx.save();
    ctx.translate(gx, gy - 58);
    for (let arm = 0; arm < 3; arm++) {
      ctx.save();
      ctx.rotate(t / 2200 + (arm * Math.PI * 2) / 3);
      for (let k = 0; k < 2; k++) {
        ctx.strokeStyle = k === 0 ? 'rgba(140,240,196,0.26)' : 'rgba(80,170,146,0.18)';
        ctx.lineWidth = k === 0 ? 7 : 12;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(8 + k * 6, 0);
        ctx.quadraticCurveTo(44, -10, 66, 16);
        ctx.quadraticCurveTo(84, 38, 60, 54);
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.restore();

    // 洞顶钟乳石（疏密不一，避免等距三角）
    const offTop = camX * 0.07;
    ctx.fillStyle = '#0b0714';
    ctx.beginPath();
    ctx.moveTo(-80, -30);
    let cx2 = -80;
    const lens = [34, 78, 22, 54, 96, 30, 68, 44, 110, 26, 60, 40, 84, 20];
    for (let i = 0; i < lens.length; i++) {
      const wid = 34 + ((i * 29) % 46);
      const hh = lens[i];
      ctx.lineTo(cx2 + wid * 0.25, hh * 0.7);
      ctx.lineTo(cx2 + wid * 0.52, hh);
      ctx.lineTo(cx2 + wid * 0.78, hh * 0.45);
      cx2 += wid;
    }
    ctx.lineTo(cx2 + 120, -30);
    ctx.closePath();
    ctx.fill();

    // 洞壁石幔（两侧）
    ctx.fillStyle = '#0f0a1a';
    for (let s = 0; s < 2; s++) {
      const dir = s === 0 ? 1 : -1;
      const bx = s === 0 ? -40 - camX * 0.18 : W + 40 - camX * 0.18;
      ctx.beginPath();
      ctx.moveTo(bx, -30);
      ctx.quadraticCurveTo(bx + dir * 120, 150, bx + dir * 58, 300);
      ctx.quadraticCurveTo(bx + dir * 130, 400, bx + dir * 44, 540);
      ctx.lineTo(bx - dir * 90, 540);
      ctx.lineTo(bx - dir * 90, -30);
      ctx.closePath();
      ctx.fill();
    }

    // 中景石笋
    const pillars = [[168, 176, 34], [410, 108, 22], [596, 224, 38], [864, 148, 26]];
    for (let i = 0; i < pillars.length; i++) {
      const p = pillars[i];
      const px = p[0] - camX * 0.3;
      ctx.fillStyle = '#171025';
      ctx.beginPath();
      ctx.moveTo(px - p[2], 540);
      ctx.quadraticCurveTo(px - p[2] * 0.42, 540 - p[1] * 0.6, px, 540 - p[1]);
      ctx.quadraticCurveTo(px + p[2] * 0.42, 540 - p[1] * 0.6, px + p[2], 540);

      ctx.fill();
      ctx.strokeStyle = 'rgba(104,196,164,0.16)';

      ctx.beginPath();
      ctx.moveTo(px - p[2] * 0.74, 528);
      ctx.quadraticCurveTo(px - p[2] * 0.26, 540 - p[1] * 0.55, px, 540 - p[1]);
      ctx.stroke();

    // 火盆
    const braziers = [[112, 416], [812, 416]];
    for (let i = 0; i < braziers.length; i++) {
      const bx = braziers[i][0] - camX * 0.42, by = braziers[i][1];
      const flick = 0.84 + Math.sin(t / 88 + i * 2) * 0.12 + Math.sin(t / 41 + i) * 0.04;
      softBlob(ctx, bx, by - 18, 108 * flick, null, [
        [0, 'rgba(255,180,96,0.5)'], [0.4, 'rgba(255,128,54,0.16)'], [1, 'rgba(255,110,40,0)'],
      ]);
      ctx.fillStyle = '#241a2e';
      ctx.beginPath();
      ctx.moveTo(bx - 17, by - 12);
      ctx.lineTo(bx + 17, by - 12);
      ctx.lineTo(bx + 10, by + 4);
      ctx.lineTo(bx - 10, by + 4);
      ctx.closePath();
      ctx.fill();
      ctx.fillRect(bx - 2.5, by + 4, 5, 16);
      ctx.fillRect(bx - 11, by + 18, 22, 4);
      ctx.fillStyle = '#ffab4a';
      ctx.beginPath();
      ctx.moveTo(bx - 8, by - 14);
      ctx.quadraticCurveTo(bx - 6, by - 30 - flick * 12, bx, by - 40 - flick * 10);
      ctx.quadraticCurveTo(bx + 6, by - 30 - flick * 12, bx + 8, by - 14);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ffe7ac';
      ctx.beginPath();
      ctx.moveTo(bx - 3.4, by - 14);
      ctx.quadraticCurveTo(bx, by - 26 - flick * 7, bx + 3.4, by - 14);
      ctx.closePath();
      ctx.fill();
    }

    // 地面雾
    ctx.fillStyle = grad(ctx, H - 150, H, [[0, 'rgba(64,140,124,0)'], [1, 'rgba(64,140,124,0.2)']]);
    ctx.fillRect(0, H - 150, W, 150);

    // 尘埃
    for (let i = 0; i < 14; i++) {
      const px = ((i * 179 + t * 8) % (W + 40)) - 20;
      const py = ((i * 113 + t * 15) % (H + 40)) - 20;
      ctx.fillStyle = 'rgba(148,228,190,0.2)';
      ctx.beginPath(); ctx.arc(px, py, 1.3, 0, Math.PI * 2); ctx.fill();
    }
  }

  // ========== 场景三：火焰山 ==========
  function sceneFire(ctx, t, camX) {
    ctx.fillStyle = grad(ctx, 0, H, [
      [0, '#1d0503'], [0.2, '#6b1c0c'], [0.38, '#b23c11'],

    // 低空烟云（压在火上，别盖住太阳）
    cloudBand(ctx, 96, t * 16 + camX * 0.05, 'rgba(30,7,4,0.55)', 2.2);
    cloudBand(ctx, 162, t * 26 + camX * 0.1, 'rgba(52,14,8,0.38)', 2.7);

    // 火山群

    for (let i = 0; i < volc.length; i++) {

        [0, '#3d1409'], [0.45, i === 1 ? '#1c0704' : '#230a05'], [1, '#0d0202'],
      ]);

      ctx.moveTo(vx - halfW, base);
      ctx.quadraticCurveTo(vx - halfW * 0.5, base - v[3] * 0.58, vx - halfW * 0.22, topY);
      ctx.lineTo(vx + halfW * 0.22, topY);
      ctx.quadraticCurveTo(vx + halfW * 0.5, base - v[3] * 0.58, vx + halfW, base);
      ctx.closePath();
      ctx.fill();
      // 火山口光

        [0, 'rgba(255,214,140,0.85)'], [0.38, 'rgba(255,120,40,0.45)'], [1, 'rgba(255,90,20,0)'],
      ]);
      if (crater) { ctx.fillStyle = crater; ctx.fillRect(vx - halfW * 0.6, topY - halfW * 0.6, halfW * 1.2, halfW * 1.2); }
      ctx.fillStyle = 'rgba(255,196,110,0.95)';
      ctx.beginPath();
      ctx.moveTo(vx - halfW * 0.2, topY + 1);
      ctx.quadraticCurveTo(vx, topY - 7, vx + halfW * 0.2, topY + 1);
      ctx.closePath(); ctx.fill();
      // 山坡熔岩流
      ctx.strokeStyle = 'rgba(255,132,48,0.6)';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(vx + halfW * 0.05, topY + 4);
      ctx.quadraticCurveTo(vx + halfW * 0.3, base - v[3] * 0.48, vx + halfW * 0.22, base - 12);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(vx - halfW * 0.1, topY + 4);
      ctx.quadraticCurveTo(vx - halfW * 0.34, base - v[3] * 0.4, vx - halfW * 0.42, base - 26);
      ctx.stroke();
      // 火山口烟柱（柔和渐变，不画成球串）
      for (let k = 0; k < 2; k++) {

  XY.makeEnemy = function (kind, x, y, levelNum) {
    const lv = Number.isFinite(Number(levelNum)) && Number(levelNum) > 0 ? Number(levelNum) : 1;
    if (kind === 'boss') {
      const b = XY.BOSS_BASE;
      const f = 1 + (lv - 1) * 0.18;
      const boss = new XY.Enemy('boss', {
        name: b.name, maxHp: Math.round(b.hp * f), hp: Math.round(b.hp * f),
        attack: Math.round(b.attack * f), defense: Math.round(b.defense * f),
        moveSpeed: b.moveSpeed, aggroRange: b.aggroRange, dropTable: b.dropTable,
      }, x, y, 116, 152);
      boss.level = lv;
      return boss;
    }
    const base = XY.scaleEnemyStats(XY.ENEMY_BASE[kind], lv);
    const sizes = { imp: [44, 54], wolf: [66, 46], spider: [56, 40] };
    const [w, h] = sizes[kind];
    const e = new XY.Enemy(kind, base, x, y, w, h);
    e.level = lv;
    return e;
  };

  XY.Enemy = class {
    constructor(kind, stats, x, y, w, h) {
      this.kind = kind;
      this.stats = stats;
      this.name = stats.name;
      this.w = w; this.h = h;
      this.x = x; this.y = y;
      this.vx = 0; this.vy = 0;
      this.facing = -1;
      this.onGround = false;
      this.hp = stats.maxHp; this.maxHp = stats.maxHp;
      this.atkReady = 0; this.stunUntil = 0;
      this.dotUntil = 0; this.dotTick = 0;
      this.alive = true;
      this.hitFlash = 0;
      this.atkUntil = 0;
      this.isBoss = kind === 'boss';
    }
    update(dt, player, level, now) {
      this.now = now;
      if (this.hitFlash > 0) this.hitFlash -= dt;
      // 击退/眩晕：不动
      if (now < this.stunUntil) { this.vx = 0; this.vy += GRAVITY * dt; XY.moveAndCollide(this, level.platforms, dt); return; }
      const dx = (player.x + player.w / 2) - (this.x + this.w / 2);
      const dist = Math.abs(dx);
      if (dist < this.stats.aggroRange) {
        this.facing = dx >= 0 ? 1 : -1;
        this.vx = approach(this.vx, this.facing * this.stats.moveSpeed, this.stats.moveSpeed * 8 * dt);
      } else {
        this.vx = approach(this.vx, 0, this.stats.moveSpeed * 8 * dt);
      }
      this.vy += GRAVITY * dt;
      if (this.vy > 1200) this.vy = 1200;
      XY.moveAndCollide(this, level.platforms, dt);
      // 兜底：不越出地图左右边界，万一掉出地图就从上空落回
      this.x = Math.max(0, Math.min(level.width - this.w, this.x));
      if (this.y > level.height + 160) { this.y = -80; this.vy = 0; this.x = Math.max(0, Math.min(level.width - this.w, this.x)); }
      // 灼烧（dot）
      if (now < this.dotUntil) {
        if (now - this.dotTick > 500) {
          this.dotTick = now;
          this.hp = Math.max(0, (Number.isFinite(this.hp) ? this.hp : this.maxHp) - 12);
          this.hitFlash = 0.1;
          if (this.hp <= 0) this.pendingKill = true; // 交给 game 走统一掉落/经验结算
        }
      }
    }
  };

  // ===== 弹道（远程技能/法宝）=====
  XY.Projectile = class {
    constructor(x, y, vx, vy, damage, owner, radius, color, life) {
      this.x = x; this.y = y; this.vx = vx; this.vy = vy;
      this.damage = damage; this.owner = owner; // 'player' | 'enemy'
      this.r = radius || 8; this.color = color || '#ffd479';
      this.life = life || 1.6; this.alive = true;
    }
    update(dt, level) {
      this.x += this.vx * dt; this.y += this.vy * dt;
      this.life -= dt;
      if (this.life <= 0) this.alive = false;
      // 撞地/平台即消失
      for (const p of level.platforms) {
        if (XY.aabb({ x: this.x - this.r, y: this.y - this.r, w: this.r * 2, h: this.r * 2 }, p)) { this.alive = false; break; }
      }
    }
  };

  // ===== 关卡运行时 =====
  XY.Level = class {
    constructor(data) {
      this.data = data;
      this.name = data.name;
      this.width = data.width; this.height = data.height;
      this.platforms = data.platforms.map((p) => ({ x: p[0], y: p[1], w: p[2], h: p[3] }));
      this.goal = data.goal;
      this.hasBoss = data.spawns.some((s) => s.type === 'boss');
      this.enemies = data.spawns.map((s) => {
        const e = XY.makeEnemy(s.type, s.x, s.y, s.level);
        XY.liftOutOfPlatforms(e, this.platforms);
        return e;
      });
    }
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = XY;
})(typeof window !== 'undefined' ? window : globalThis);

    <script>
/* ===== ui.js ===== */
// 渲染层：背景 / 世界 / HUD / 背包 / 各类界面。挂到 XY.UI。纯绘制，不处理逻辑。
(function (root) {
  const XY = (root.XY = root.XY || {});
  const UI = (XY.UI = {});
  const Art = () => XY.Art;

  const W = 960, H = 540;

  function rrect(ctx, x, y, w, h, r) {
    const rad = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.lineTo(x + w - rad, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + rad);
    ctx.lineTo(x + w, y + h - rad);
    ctx.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
    ctx.lineTo(x + rad, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - rad);
    ctx.lineTo(x, y + rad);
    ctx.quadraticCurveTo(x, y, x + rad, y);
    ctx.closePath();
  }
  function bar(ctx, x, y, w, h, pct, fg, bgc) {
    pct = Math.max(0, Math.min(1, pct));
    ctx.fillStyle = bgc || '#1a2130';
    rrect(ctx, x, y, w, h, h / 2); ctx.fill();
    if (pct > 0) {
      ctx.fillStyle = fg;
      rrect(ctx, x, y, Math.max(h, w * pct), h, h / 2); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 1;
    rrect(ctx, x, y, w, h, h / 2); ctx.stroke();
  }
  // 祥云：一片软云（筋斗云缠身时绕角色飘）
  function xiangyun(ctx, x, y, s, alpha) {
    if (!(alpha > 0.01) || !(s > 0.01)) return;
    const prev = ctx.globalAlpha;
    ctx.globalAlpha = Math.min(1, Math.max(0, alpha));
    const puffs = [[-7, 1, 6], [0, -3, 8], [7, 1, 6], [0, 4, 6.5]];
    ctx.fillStyle = 'rgba(255,246,226,0.95)';
    for (let i = 0; i < puffs.length; i++) {
      ctx.beginPath();
      ctx.arc(x + puffs[i][0] * s, y + puffs[i][1] * s, Math.max(0.4, puffs[i][2] * s), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.strokeStyle = 'rgba(255,206,128,0.7)';
    ctx.lineWidth = Math.max(0.8, 1.3 * s);
    ctx.beginPath();
    ctx.arc(x, y - 3 * s, 7.6 * s, Math.PI * 1.05, Math.PI * 1.95);
    ctx.stroke();
    ctx.globalAlpha = prev;
  }

  function center(ctx, text, y, font, color) {    ctx.fillStyle = color || '#fff'; ctx.font = font; ctx.textAlign = 'center';
    ctx.fillText(text, W / 2, y); ctx.textAlign = 'left';
  }
  // maxLines：超出后自动省略，避免文字溢出卡片
  function wrapText(ctx, text, x, y, maxW, lh, maxLines) {
    const chars = String(text || '').split('');
    let line = '', yy = y, lines = 0;
    for (const ch of chars) {
      if (ch === '\n' || ctx.measureText(line + ch).width > maxW) {
        if (maxLines && lines >= maxLines - 1) {
          let cut = line;
          while (cut.length > 1 && ctx.measureText(cut + '…').width > maxW) cut = cut.slice(0, -1);
          ctx.fillText(cut + '…', x, yy);
          return yy;
        }
        ctx.fillText(line, x, yy);
        line = ch === '\n' ? '' : ch;
        yy += lh; lines++;
      } else line += ch;
    }
    ctx.fillText(line, x, yy);
    return yy;
  }
  UI.wrapText = wrapText;

  // ===== 背景 =====
  const SKIES = [
    { top: '#3f6f96', bottom: '#0d1a2a', sun: '#ffe9a8', far: '#24405c', near: '#16324a', ground: '#2a2019', top2: '#4f7a3a', mist: 'rgba(150,200,240,0.10)' }, // 花果山
    { top: '#3a2b52', bottom: '#0c0814', sun: '#c8a6ff', far: '#241a38', near: '#150f24', ground: '#241a2c', top2: '#6a4f8a', mist: 'rgba(180,140,255,0.10)' }, // 黑风洞
    { top: '#7a2a18', bottom: '#180705', sun: '#ff9b5e', far: '#4a1a12', near: '#300f0a', ground: '#2b1510', top2: '#8a3a20', mist: 'rgba(255,140,80,0.12)' }, // 火焰山
  ];
  UI.SKIES = SKIES;

  // 背景交由场景层绘制：每关一张主题立绘（远 / 中景 + 视差 + 动态元素）
  UI.drawBackground = function (ctx, levelIndex, t, camX) {
    if (XY.Scenery && XY.Scenery.draw) { XY.Scenery.draw(ctx, levelIndex, t || 0, camX || 0); return; }
    // 兜底：场景层缺失时至少铺一层天空色
    const sky = SKIES[levelIndex % SKIES.length];
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, sky.top); g.addColorStop(1, sky.bottom);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  };

  // ===== 世界（已 translate 到相机坐标）=====
  const ENEMY_ART_H = { imp: 34, wolf: 36, spider: 32, boss: 86 };

  // 每关平台材质：岩体主色 / 表层色 / 亮边 / 装饰类型
  const PLATFORM_STYLE = [
    { body: '#241d16', top: '#4b7a3c', lit: '#6aa052', deco: 'grass' },  // 花果山：青苔岩
    { body: '#191327', top: '#5c4580', lit: '#8a6cb4', deco: 'moss' },   // 黑风洞：黑曜石
    { body: '#1e0d08', top: '#7c2f18', lit: '#e07a2e', deco: 'lava' },   // 火焰山：焦岩
  ];

  UI.drawPlatforms = function (ctx, game) {
    const st = PLATFORM_STYLE[(game.levelIndex || 0) % 3];
    for (const p of game.level.platforms) {
      // 岩体：下沿做不规则断裂，避免出现规整的矩形板子
      const segs = Math.max(2, Math.round(p.w / 64));
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + p.w, p.y);
      for (let i = segs; i >= 0; i--) {
        const xx = p.x + (p.w / segs) * i;
        const rr = Math.abs(Math.sin((xx + p.y * 3.1) * 0.37) * 9137.13) % 1;
        ctx.lineTo(xx, p.y + p.h + rr * (p.h > 30 ? 0 : 7));
      }
      ctx.closePath();
      ctx.fillStyle = st.body;
      ctx.fill();

      // 岩体竖向层理
      ctx.strokeStyle = 'rgba(0,0,0,0.26)';
      ctx.lineWidth = 1;
      for (let x = p.x + 30; x < p.x + p.w; x += 56) {
        const rr = Math.abs(Math.sin(x * 1.7) * 5171.3) % 1;
        ctx.beginPath();
        ctx.moveTo(x, p.y + 8);
        ctx.lineTo(x + (rr - 0.5) * 10, p.y + p.h);
        ctx.stroke();
      }
      // 底部压暗
      ctx.fillStyle = 'rgba(0,0,0,0.34)';
      ctx.fillRect(p.x, p.y + p.h - 5, p.w, 5);

      // 表层
      ctx.fillStyle = st.top;
      ctx.fillRect(p.x, p.y, p.w, 7);
      ctx.fillStyle = st.lit;
      ctx.fillRect(p.x, p.y, p.w, 2);

      if (st.deco === 'grass') {
        ctx.strokeStyle = st.lit;
        ctx.lineWidth = 2;
        for (let x = p.x + 7; x < p.x + p.w; x += 32) {
          const hh = 4 + (Math.abs(Math.sin(x * 0.9) * 7919) % 1) * 6;
          ctx.beginPath();
          ctx.moveTo(x, p.y);
          ctx.quadraticCurveTo(x + 1.5, p.y - hh * 0.6, x + 3.5, p.y - hh);
          ctx.stroke();
        }
      } else if (st.deco === 'moss') {
        for (let x = p.x + 10; x < p.x + p.w; x += 41) {
          const rr = Math.abs(Math.sin(x * 2.3) * 4021.7) % 1;
          ctx.fillStyle = 'rgba(126,214,178,' + (0.12 + rr * 0.18).toFixed(2) + ')';
          ctx.beginPath();
          ctx.arc(x, p.y - 2 - rr * 3, 2.2 + rr * 2.6, 0, Math.PI * 2);
          ctx.fill();
        }
      } else {
        // 熔岩裂缝（发光）
        for (let x = p.x + 34; x < p.x + p.w; x += 78) {
          const rr = Math.abs(Math.sin(x * 3.1) * 6131.7) % 1;
          ctx.strokeStyle = 'rgba(255,138,48,0.85)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x, p.y + 4);
          ctx.lineTo(x + (rr - 0.5) * 16, p.y + 12 + rr * 10);
          ctx.lineTo(x + (rr - 0.5) * 24, p.y + p.h - 2);
          ctx.stroke();
          ctx.strokeStyle = 'rgba(255,196,110,0.4)';
          ctx.lineWidth = 4;
          ctx.stroke();
        }
      }
    }
  };

  UI.drawGoal = function (ctx, game) {
    const gx = game.level.goal.x, gy = game.level.goal.y;
    ctx.strokeStyle = '#e8e2d0'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx, gy - 84); ctx.stroke();
    // 旗面（飘动）
    const flap = Math.sin(game.now / 260) * 4;
    ctx.beginPath();
    ctx.moveTo(gx, gy - 84);
    ctx.quadraticCurveTo(gx + 26, gy - 78 + flap, gx + 46, gy - 70);
    ctx.lineTo(gx + 44, gy - 44);
    ctx.quadraticCurveTo(gx + 24, gy - 48 - flap, gx, gy - 46);
    ctx.closePath();
    ctx.fillStyle = '#c0392b'; ctx.fill();
    ctx.strokeStyle = '#ffd479'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#ffe9a8'; ctx.font = 'bold 14px serif'; ctx.fillText('终', gx + 14, gy - 56);
  };

  UI.drawWorld = function (ctx, game) {
    const now = game.now;
    UI.drawPlatforms(ctx, game);
    UI.drawGoal(ctx, game);

    // 残影（在角色后面）
    if (game.fx) game.fx.draw(ctx, 'back');

    // 敌人
    for (const e of game.level.enemies) {
      if (!e.alive) continue;
      const k = (e.h / (ENEMY_ART_H[e.kind] || 34)) * 1.02;
      Art().drawEnemy(ctx, e, now, k);
      // 血条
      if (!e.isBoss) {
        const bw = Math.max(30, e.w);
        bar(ctx, e.x + (e.w - bw) / 2, e.y - 10, bw, 4.5, e.hp / e.maxHp, '#e74c3c');
      }
      if (e.stunUntil > now) {
        ctx.fillStyle = '#ffd479'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('★', e.x + e.w / 2, e.y - 16);
        ctx.textAlign = 'left';
      }
    }

    // 掷出的金箍棒：空中急旋 / 插地余波
    if (game.specials) {
      for (const s of game.specials) {
        if (!s || s.dead) continue;
        if (Art().drawSpinStaff) Art().drawSpinStaff(ctx, s, now);
      }
    }

    // 弹道（带光晕拖尾）
    for (const p of game.projectiles) {
      const g2 = ctx.createRadialGradient ? ctx.createRadialGradient(p.x, p.y, 1, p.x, p.y, p.r * 3.2) : null;
      if (g2 && g2.addColorStop) { g2.addColorStop(0, p.color); g2.addColorStop(1, 'rgba(0,0,0,0)'); ctx.globalAlpha = 0.55; ctx.fillStyle = g2; }
      else ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 3, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.55, 0, Math.PI * 2); ctx.fill();
    }

    // 玩家（2D 造型）
    const pl = game.player;
    const cloudOn = pl && now < (pl.cloudAuraUntil || 0);
    // 筋斗云的祥云：绕着角色转，后三片在身后
    if (cloudOn) {
      const fade = Math.min(1, (pl.cloudAuraUntil - now) / 240);
      const bx = pl.x + pl.w / 2, by = pl.y + pl.h * 0.58;
      for (let i = 0; i < 3; i++) {
        const ang = now / 175 + i * (Math.PI * 2 / 5);
        const rx = 30 + (i % 2) * 9;
        xiangyun(ctx, bx + Math.cos(ang) * rx, by + Math.sin(ang) * rx * 0.55,
          0.5 + 0.22 * (0.5 + 0.5 * Math.sin(ang)), 0.75 * fade);
      }
    }
    if (pl && pl.hp > 0) {
      const scale = XY.PLAYER_SCALE || 1.15;
      const pose = pl.pose(now);
      // 无敌闪烁
      if (pl.invuln > now && Math.floor(now / 90) % 2 === 0) ctx.globalAlpha = 0.45;
      // 护盾 / 加速光环
      if (now < pl.shieldUntil) {
        const prevA = ctx.globalAlpha;
        ctx.globalAlpha = prevA * 0.85;
        ctx.strokeStyle = 'rgba(255,212,121,0.9)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse ? ctx.ellipse(pl.x + pl.w / 2, pl.y + pl.h / 2, 32, 40, 0, 0, Math.PI * 2) : ctx.arc(pl.x + pl.w / 2, pl.y + pl.h / 2, 34, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = prevA;
      }
      Art().drawCharacter(ctx, pl.x + pl.w / 2, pl.y + pl.h + 2, scale, pl.char.id, pose);
      // 另外两片祥云转到身前，形成"云缠身"的包围感
      if (now < (pl.cloudAuraUntil || 0)) {
        const fade = Math.min(1, (pl.cloudAuraUntil - now) / 240);
        const bx = pl.x + pl.w / 2, by = pl.y + pl.h * 0.58;
        for (let i = 0; i < 2; i++) {
          const ang = now / 175 + 2.4 + i * (Math.PI * 2 / 5);
          const rx = 34 + i * 6;
          xiangyun(ctx, bx + Math.cos(ang) * rx, by + Math.sin(ang) * rx * 0.55, 0.62, 0.8 * fade);
        }
      }
      ctx.globalAlpha = 1;
      if (now < pl.buffSpdUntil) {
        ctx.fillStyle = 'rgba(127,208,255,0.85)';
        for (let i = 0; i < 3; i++) {
          const yy = pl.y + 14 + i * 16;
          ctx.fillRect(pl.x - 14 - i * 5, yy, 10, 2);
        }
      }
    }

    // 特效（刀光/火花/冲击环在前）
    if (game.fx) game.fx.draw(ctx, 'front');
  };

  // ===== HUD =====
  UI.drawPortrait = function (ctx, game) {
    const pl = game.player;
    const x = 14, y = 12, size = 84;
    // 外框
    ctx.save();
    rrect(ctx, x - 2, y - 2, size + 4, size + 4, 14);
    const g = ctx.createLinearGradient(x, y, x + size, y + size);
    g.addColorStop(0, '#f4c430'); g.addColorStop(0.5, '#8a6a22'); g.addColorStop(1, '#f4c430');
    ctx.fillStyle = g; ctx.fill();
    rrect(ctx, x, y, size, size, 12);
    const bg = ctx.createLinearGradient(x, y, x, y + size);
    bg.addColorStop(0, '#243046'); bg.addColorStop(1, '#101724');
    ctx.fillStyle = bg; ctx.fill();
    // 头像
    ctx.save();
    rrect(ctx, x, y, size, size, 12); ctx.clip();
    Art().drawFace(ctx, x + size / 2, y + 57, 23, pl.char.id, { t: game.now, mood: 'calm' });
    ctx.restore();
    // 等级徽标
    const bw = 34, bh = 18;
    rrect(ctx, x + size - bw + 4, y + size - bh + 4, bw, bh, 9);
    ctx.fillStyle = 'rgba(12,16,24,0.92)'; ctx.fill();
    ctx.strokeStyle = '#ffd479'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#ffd479'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Lv.' + pl.level, x + size - bw / 2 + 4, y + size - 1);
    ctx.textAlign = 'left';
    ctx.restore();
  };

  UI.drawHUD = function (ctx, game) {
    const pl = game.player;
    UI.drawPortrait(ctx, game);

    const bx = 108, bw = 252;
    // 名字 + 称号
    ctx.fillStyle = '#fff'; ctx.font = 'bold 17px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText(pl.char.name, bx, 30);
    const nameW = ctx.measureText(pl.char.name).width; // 必须在切换字号前量宽
    ctx.fillStyle = '#ffd479'; ctx.font = '12px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText('· ' + pl.char.title, bx + nameW + 10, 29);

    // 气血
    bar(ctx, bx, 38, bw, 16, pl.hp / pl.maxHp, '#e0453a', '#221a1f');
    ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.font = 'bold 11px sans-serif';
    ctx.fillText(Math.ceil(pl.hp) + ' / ' + pl.maxHp, bx + 8, 50);
    // 法力（气）
    bar(ctx, bx, 58, bw * 0.78, 11, pl.energy / pl.maxEnergy, '#3da5ff', '#141d2b');
    ctx.fillStyle = '#cfe8ff'; ctx.font = '10px sans-serif';
    ctx.fillText('气 ' + Math.ceil(pl.energy), bx + 6, 67);
    // 经验
    const need = XY.expToNext(pl.level);
    bar(ctx, bx, 75, bw * 0.78, 6, pl.exp / need, '#a06bff', '#1a1626');
    ctx.fillStyle = '#b9a2e8'; ctx.font = '10px sans-serif';
    ctx.fillText('EXP ' + Math.floor(pl.exp) + '/' + need, bx + bw * 0.78 + 8, 81);

    // 关卡名 + 进度
    ctx.textAlign = 'right';
    ctx.fillStyle = '#dfe7f2'; ctx.font = 'bold 14px "PingFang SC", sans-serif';
    ctx.fillText(game.level.name, W - 20, 30);
    const total = game.level.enemies.length;
    const killed = game.level.enemies.filter((e) => !e.alive).length;
    ctx.fillStyle = '#8a93a6'; ctx.font = '11px sans-serif';
    ctx.fillText(game.level.hasBoss ? '击败牛魔王即可通关' : '妖物 ' + killed + '/' + total + ' · 抵达终点旗帜通关', W - 20, 48);
    ctx.textAlign = 'left';

    // 状态图标（护盾/加速/攻击/防御）
    let bxx = 108;
    const now = game.now;
    const buffs = [];
    if (now < pl.buffAtkUntil) buffs.push(['攻', '#ffb35c']);
    if (now < pl.buffDefUntil) buffs.push(['防', '#8bc8ff']);
    if (now < pl.buffSpdUntil) buffs.push(['速', '#7fd0ff']);
    if (now < pl.shieldUntil) buffs.push(['盾', '#ffd479']);
    for (const b of buffs) {
      rrect(ctx, bxx, 88, 22, 16, 5);
      ctx.fillStyle = 'rgba(20,26,38,0.9)'; ctx.fill();
      ctx.strokeStyle = b[1]; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = b[1]; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(b[0], bxx + 11, 100); ctx.textAlign = 'left';
      bxx += 26;
    }

    // —— 技能图标 ——
    // 底部操作条压暗：避免怪物/地形从图标缝隙里透出来，保证可读性
    const scrimTop = H - 108;
    if (ctx.createLinearGradient) {
      const sg = ctx.createLinearGradient(0, scrimTop, 0, H);
      sg.addColorStop(0, 'rgba(6,9,14,0)');
      sg.addColorStop(0.6, 'rgba(6,9,14,0.55)');
      sg.addColorStop(1, 'rgba(6,9,14,0.82)');
      ctx.fillStyle = sg;
    } else {
      ctx.fillStyle = 'rgba(6,9,14,0.62)';
    }
    ctx.fillRect(0, scrimTop, W, H - scrimTop);

    const skillKeys = ['K', 'U', 'I'];
    for (let i = 0; i < 3; i++) {
      const sid = pl.char.skills[i];
      const sk = sid ? XY.getSkill(sid) : null;
      const x = 18 + i * 62, y = H - 82, size = 54;
      if (!sk) {
        rrect(ctx, x, y, size, size, size * 0.2);
        ctx.fillStyle = 'rgba(20,26,38,0.85)'; ctx.fill();
        ctx.strokeStyle = '#2a3550'; ctx.stroke();
        continue;
      }
      const cd = pl.skillCd[sk.id] || 0;
      const cdPct = now < cd ? (cd - now) / sk.cooldown : 0;
      const ready = pl.energy >= sk.cost && cdPct <= 0;
      Art().drawSkillIcon(ctx, x, y, size, sk, cdPct, ready);
      // 按键角标
      rrect(ctx, x + size - 16, y + size - 16, 16, 16, 4);
      ctx.fillStyle = 'rgba(8,11,17,0.9)'; ctx.fill();
      ctx.fillStyle = ready ? '#ffd479' : '#6c788c'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(skillKeys[i], x + size - 8, y + size - 4);
      ctx.textAlign = 'left';
      // 名称
      ctx.fillStyle = '#9fb0c8'; ctx.font = '10px "PingFang SC", sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(sk.name, x + size / 2, y - 6);
      ctx.textAlign = 'left';
    }

    // —— 法宝图标 ——
    for (let i = 0; i < 3; i++) {
      const tid = pl.treasures[i];
      const size = 54, x = W - 18 - size - (2 - i) * 62, y = H - 82;
      if (!tid) {
        rrect(ctx, x, y, size, size, size * 0.2);
        ctx.fillStyle = 'rgba(20,26,38,0.7)'; ctx.fill();
        ctx.strokeStyle = '#2a2a3a'; ctx.stroke();
        ctx.fillStyle = '#4b5468'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('空', x + size / 2, y + size / 2 + 4); ctx.textAlign = 'left';
        continue;
      }
      const t = XY.getTreasure(tid);
      const cd = pl.treasureCd[tid] || 0;
      const cdPct = now < cd ? (cd - now) / t.cooldown : 0;
      Art().drawTreasureIcon(ctx, x, y, size, t, cdPct, true);
      rrect(ctx, x + size - 16, y + size - 16, 16, 16, 4);
      ctx.fillStyle = 'rgba(8,11,17,0.9)'; ctx.fill();
      ctx.fillStyle = cdPct <= 0 ? '#d6b3ff' : '#6c788c'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(String(i + 1), x + size - 8, y + size - 4);
      ctx.textAlign = 'left';
      ctx.fillStyle = '#9a8fb8'; ctx.font = '10px "PingFang SC", sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(t.name, x + size / 2, y - 6);
      ctx.textAlign = 'left';
    }

    // —— 经验飘字（在 EXP 条附近） ——
    if (game.expPops) {
      for (const p of game.expPops) {
        const a = Math.max(0, Math.min(1, p.life / 0.5));
        ctx.globalAlpha = a;
        ctx.fillStyle = p.color || '#9be7ff';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText(p.text, bx + bw * 0.78 + 8, 96 - (1.1 - Math.min(1.1, p.life)) * 22);
        ctx.globalAlpha = 1;
      }
    }

    // 底部提示
    ctx.fillStyle = 'rgba(140,152,175,0.85)'; ctx.font = '11px "PingFang SC", sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('B 背包 · L 合成 · P 暂停 · 双击 A/D 奔跑 · 空中再按 W 二段跳', W / 2, H - 6);
    ctx.textAlign = 'left';

    if (XY.Input && XY.Input.keyCount === 0) {
      ctx.fillStyle = 'rgba(255,212,121,0.92)'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('键盘未接管 · 用画面下方按钮操作（或先点一下画面再按键）', W / 2, 112);
      ctx.textAlign = 'left';
    }
  };

  // ===== 选角 =====
  UI.drawCharSelect = function (ctx, game) {
    UI.drawBackground(ctx, 0, game.uiTime);
    center(ctx, '选择你的角色', 52, 'bold 34px serif', '#ffd479');
    const order = XY.CHARACTER_ORDER;
    const cardW = 168, gap = 14, total = order.length * cardW + (order.length - 1) * gap;
    const x0 = (W - total) / 2;
    for (let i = 0; i < order.length; i++) {
      const c = XY.CHARACTERS[order[i]];
      const x = x0 + i * (cardW + gap), y = 80;
      const sel = i === game.charIndex;
      rrect(ctx, x, y, cardW, 384, 12);
      ctx.fillStyle = sel ? 'rgba(42,53,80,0.96)' : 'rgba(20,26,38,0.9)'; ctx.fill();
      ctx.strokeStyle = sel ? '#ffd479' : '#33405c'; ctx.lineWidth = sel ? 3 : 1; ctx.stroke();
      if (sel) {
        ctx.save();
        ctx.shadowColor = 'rgba(255,212,121,0.55)'; ctx.shadowBlur = 18;
        rrect(ctx, x, y, cardW, 384, 12); ctx.stroke();
        ctx.restore();
      }
      // 立绘
      ctx.save();
      rrect(ctx, x + 6, y + 6, cardW - 12, 172, 8); ctx.clip();
      const bgG = ctx.createLinearGradient(x, y, x, y + 180);
      bgG.addColorStop(0, 'rgba(255,255,255,0.06)'); bgG.addColorStop(1, 'rgba(0,0,0,0.25)');
      ctx.fillStyle = bgG; ctx.fillRect(x + 6, y + 6, cardW - 12, 172);
      const bounce = sel ? Math.sin(game.uiTime / 420) * 3 : 0;
      Art().drawCharacter(ctx, x + cardW / 2, y + 168 + bounce, 1.55, c.id, { t: game.uiTime, state: 'idle', facing: 1 });
      ctx.restore();

      ctx.textAlign = 'center';
      ctx.fillStyle = '#fff'; ctx.font = 'bold 20px "PingFang SC", sans-serif';
      ctx.fillText(c.name, x + cardW / 2, y + 208);
      ctx.fillStyle = '#ffd479'; ctx.font = '12px "PingFang SC", sans-serif';
      ctx.fillText(c.title, x + cardW / 2, y + 226);
      // 属性条
      const stats = [['气血', c.base.maxHp / 3.2, '#e0453a'], ['攻击', c.base.attack * 3.4, '#ffb35c'], ['防御', c.base.defense * 5, '#8bc8ff']];
      let sy = y + 244;
      for (const s of stats) {
        ctx.textAlign = 'left';
        ctx.fillStyle = '#8a93a6'; ctx.font = '10px "PingFang SC", sans-serif';
        ctx.fillText(s[0], x + 14, sy + 7);
        rrect(ctx, x + 44, sy, cardW - 58, 7, 3.5);
        ctx.fillStyle = '#1a2130'; ctx.fill();
        rrect(ctx, x + 44, sy, Math.min(cardW - 58, s[1]), 7, 3.5);
        ctx.fillStyle = s[2]; ctx.fill();
        sy += 16;
      }
      // 技能小图标
      for (let k = 0; k < c.skills.length; k++) {
        const sk = XY.getSkill(c.skills[k]);
        if (!sk) continue;
        Art().drawSkillIcon(ctx, x + 16 + k * 30, y + 296, 26, sk, 0, true);
      }
      ctx.textAlign = 'left';
      ctx.fillStyle = '#9fb0c8'; ctx.font = '10px "PingFang SC", sans-serif';
      wrapText(ctx, c.backstory, x + 14, y + 340, cardW - 28, 12);
    }
    center(ctx, 'A / D 或 ← → 选择 · Enter 确认', 498, '16px "PingFang SC", sans-serif', '#fff');
  };

  // ===== 过场 CG =====
  UI.drawCutscene = function (ctx, beat, alpha, t) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, beat.bgTop); g.addColorStop(1, beat.bgBottom);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // 放射光
    ctx.globalAlpha = 0.12;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2 + t / 5200;
      ctx.beginPath(); ctx.moveTo(W / 2, 240);
      ctx.lineTo(W / 2 + Math.cos(a) * 700, 240 + Math.sin(a) * 700); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    center(ctx, beat.glyph, 206, '86px serif', 'rgba(255,255,255,0.95)');
    center(ctx, beat.title, 282, 'bold 30px serif', '#ffd479');
    for (let i = 0; i < beat.lines.length; i++) center(ctx, beat.lines[i], 330 + i * 30, '17px "PingFang SC", sans-serif', '#eae4d8');
    center(ctx, '按 Enter / 空格 跳过', 500, '13px "PingFang SC", sans-serif', '#8a93a6');
  };

  // ===== 合成坊 =====
  UI.drawCraft = function (ctx, game) {
    UI.drawBackground(ctx, game.levelIndex, game.uiTime);
    ctx.fillStyle = 'rgba(6,9,14,0.72)'; ctx.fillRect(0, 0, W, H);
    center(ctx, '法宝合成坊', 56, 'bold 32px serif', '#ffd479');
    center(ctx, 'W/S 或 ↑↓ 选择 · Enter 合成 · B 背包 · Esc 返回', 86, '13px "PingFang SC", sans-serif', '#cfe0f5');
    const panelW = 720, px = (W - panelW) / 2;
    for (let i = 0; i < XY.RECIPES.length; i++) {
      const r = XY.RECIPES[i];
      const y = 118 + i * 96;
      const sel = i === game.craftIndex;
      const can = XY.canCraft(game.inventory, r);
      rrect(ctx, px, y, panelW, 82, 10);
      ctx.fillStyle = sel ? 'rgba(42,53,80,0.96)' : 'rgba(18,24,36,0.9)'; ctx.fill();
      ctx.strokeStyle = sel ? (can ? '#7CFC9B' : '#ffd479') : '#2a3550'; ctx.lineWidth = sel ? 3 : 1; ctx.stroke();

      const out = XY.ITEMS[r.output.itemId];
      if (out) {
        if (out.slot) Art().drawEquipIcon(ctx, px + 16, y + 13, 56, out);
        else Art().drawMaterialIcon(ctx, px + 16, y + 13, 56, out.id);
      }
      ctx.fillStyle = '#fff'; ctx.font = 'bold 17px "PingFang SC", sans-serif';
      ctx.fillText(r.name, px + 86, y + 26);
      ctx.fillStyle = '#93a0b5'; ctx.font = '11.5px "PingFang SC", sans-serif';

      // 材料需求 + 图标
      let ix = px + 86;

        const it = XY.ITEMS[id];
        const need = r.inputs[id];
        const have = game.inventory[id] || 0;

        ix += 128;

      if (out && out.bonus) {

        ctx.fillStyle = '#9be7ff'; ctx.font = '11px "PingFang SC", sans-serif'; ctx.textAlign = 'right';

  function statName(k) {

  const TABS = ['材料', '法宝', '装备'];

  UI.drawBag = function (ctx, game) {
    UI.drawBackground(ctx, game.levelIndex, game.uiTime);
    ctx.fillStyle = 'rgba(5,8,13,0.82)'; ctx.fillRect(0, 0, W, H);

    // 标题
    ctx.fillStyle = '#ffd479'; ctx.font = 'bold 28px serif';
    ctx.fillText('行 囊', 40, 54);
    ctx.fillStyle = '#8a93a6'; ctx.font = '12px "PingFang SC", sans-serif';
    ctx.fillText('打怪掉落材料 → 合成法宝装备 → 背包里装备上阵', 40, 74);

    // 分页
    let tx = 40;
    for (let i = 0; i < TABS.length; i++) {
      const on = i === game.bagTab;
      const w = 92;
      rrect(ctx, tx, 92, w, 30, 8);
      ctx.fillStyle = on ? 'rgba(255,212,121,0.16)' : 'rgba(22,28,42,0.9)'; ctx.fill();
      ctx.strokeStyle = on ? '#ffd479' : '#2a3550'; ctx.lineWidth = on ? 2 : 1; ctx.stroke();
      ctx.fillStyle = on ? '#ffd479' : '#93a0b5'; ctx.font = 'bold 14px "PingFang SC", sans-serif';
      ctx.textAlign = 'center'; ctx.fillText((i + 1) + ' · ' + TABS[i], tx + w / 2, 112); ctx.textAlign = 'left';
      tx += w + 10;
    }

    const items = game.bagItems();
    // 网格
    const cols = 5, cell = 86, gapX = 10, gapY = 10;
    const gx0 = 40, gy0 = 142;
    for (let i = 0; i < cols * 4; i++) {
      const cx = gx0 + (i % cols) * (cell + gapX);
      const cy = gy0 + Math.floor(i / cols) * (cell + gapY);
      const it = items[i];
      const sel = i === game.bagIndex && it;
      rrect(ctx, cx, cy, cell, cell, 10);
      ctx.fillStyle = sel ? 'rgba(42,53,80,0.98)' : 'rgba(16,21,32,0.86)'; ctx.fill();
      ctx.strokeStyle = sel ? '#ffd479' : '#232c3e'; ctx.lineWidth = sel ? 2.5 : 1; ctx.stroke();
      if (!it) continue;
      drawItemIcon(ctx, it, cx + (cell - 52) / 2, cy + 8, 52);
      // 数量
      if (it.count > 1) {
        ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'right';
        ctx.fillText('×' + it.count, cx + cell - 6, cy + cell - 6); ctx.textAlign = 'left';
      }
      // 已装备标记
      if (it.equipped) {
        rrect(ctx, cx + 4, cy + 4, 34, 16, 5);
        ctx.fillStyle = 'rgba(124,252,155,0.9)'; ctx.fill();
        ctx.fillStyle = '#06210f'; ctx.font = 'bold 10px "PingFang SC", sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('已装', cx + 21, cy + 15); ctx.textAlign = 'left';
      }
      // 名称
      ctx.fillStyle = '#c9d4e4'; ctx.font = '11px "PingFang SC", sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(it.name, cx + cell / 2, cy + cell - 20); ctx.textAlign = 'left';
    }

    // 详情面板
    const dx = 610, dy = 142, dw = 310, dh = 306;
    rrect(ctx, dx, dy, dw, dh, 12);
    ctx.fillStyle = 'rgba(14,19,28,0.94)'; ctx.fill();
    ctx.strokeStyle = '#2a3550'; ctx.lineWidth = 1; ctx.stroke();

    const sel = items[game.bagIndex];
    if (!sel) {
      ctx.fillStyle = '#5b6678'; ctx.font = '13px "PingFang SC", sans-serif'; ctx.textAlign = 'center';

      ctx.fillStyle = '#ffd479'; ctx.font = '12px "PingFang SC", sans-serif';
      ctx.fillText(sel.kindName, dx + 108, dy + 66);
      if (sel.count > 1) {
        ctx.fillStyle = '#9fb0c8'; ctx.font = '11px sans-serif';
        ctx.fillText('持有 ' + sel.count + ' 件', dx + 108, dy + 84);
      }
      ctx.fillStyle = '#a9b6c8'; ctx.font = '12px "PingFang SC", sans-serif';
      let ty2 = wrapText(ctx, sel.desc, dx + 22, dy + 122, dw - 44, 18);
      if (sel.bonusText) {
        ctx.fillStyle = '#9be7ff'; ctx.font = 'bold 12px "PingFang SC", sans-serif';
        ty2 = wrapText(ctx, sel.bonusText, dx + 22, ty2 + 26, dw - 44, 17);
      }
      if (sel.effectText) {
        ctx.fillStyle = '#c39bff'; ctx.font = '12px "PingFang SC", sans-serif';
        ty2 = wrapText(ctx, sel.effectText, dx + 22, ty2 + 24, dw - 44, 17);
      }
      if (sel.action) {
        ctx.fillStyle = '#ffd479'; ctx.font = 'bold 13px "PingFang SC", sans-serif'; ctx.textAlign = 'center';

    // 底部操作提示
    ctx.fillStyle = 'rgba(150,162,182,0.9)'; ctx.font = '12px "PingFang SC", sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Q/E 或 1·2·3 换分页 · WASD 选格 · Enter 使用/装备 · B 或 Esc 关闭', W / 2, H - 26);
    ctx.textAlign = 'left';

  function drawItemIcon(ctx, it, x, y, size) {
    if (it.icon === 'treasure') Art().drawTreasureIcon(ctx, x, y, size, XY.getTreasure(it.id), 0, true);
    else if (it.icon === 'equip') {
      const item = XY.ITEMS[it.id];
      if (item && item.slot) Art().drawEquipIcon(ctx, x, y, size, item);
    } else if (it.icon === 'material') Art().drawMaterialIcon(ctx, x, y, size, it.id);
  }

  // ===== Toast =====
  UI.drawToast = function (ctx, game) {

    for (const t of game.toasts) {
